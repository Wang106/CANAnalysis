<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CANAnalysis 回归测试</title>
<style>
  body{font:14px system-ui,sans-serif;margin:24px;background:#111;color:#ddd}
  h1{font-size:20px}.pass{color:#55d98b}.fail{color:#ff7474}li{margin:7px 0}
  iframe{position:absolute;width:1px;height:1px;border:0;left:-9999px}
</style>
</head>
<body>
<h1>CANAnalysis 回归测试</h1>
<p id="summary">运行中…</p>
<ol id="results"></ol>
<iframe id="app" src="../public/index.html?regression=1"></iframe>
<script>
'use strict';
const tests=[];
const assert=(condition,message)=>{if(!condition)throw new Error(message);};
const waitFor=async(check,timeout=5000)=>{
  const start=Date.now();
  while(Date.now()-start<timeout){if(check())return;await new Promise(r=>setTimeout(r,25));}
  throw new Error('等待异步结果超时');
};
const record=async(name,fn)=>{
  try{await fn();tests.push({name,ok:true});}
  catch(error){tests.push({name,ok:false,error:error.message});}
};
document.getElementById('app').addEventListener('load',async()=>{
  const frame=document.getElementById('app');
  const win=frame.contentWindow;
  const doc=frame.contentDocument;
  const api=win.__can;
  const sampleDbc=await fetch('../public/sample.dbc').then(r=>r.text());
  const sampleAsc=await fetch('../public/sample.asc').then(r=>r.text());

  await record('关于本站页面包含功能介绍、双收款码预留位与一致的栏目导航',async()=>{
    const html=await fetch('../public/aboutus.html').then(r=>{if(!r.ok)throw new Error('页面文件不存在');return r.text();});
    const about=new DOMParser().parseFromString(html,'text/html');
    assert(about.title.includes('关于本站'),'页面标题错误');
    assert(about.querySelector('[data-feature-list]'),'缺少网页功能介绍');
    assert(about.querySelector('[data-qr="wechat"]'),'缺少微信二维码预留位');
    assert(about.querySelector('[data-qr="alipay"]'),'缺少支付宝二维码预留位');
    const aboutNav=about.getElementById('topNav');
    const aboutItems=Array.from(aboutNav?.querySelectorAll('.nav-item')||[]);
    assert(aboutItems.map(item=>item.textContent).join('|')==='首页|CAN报文解析|格式转换|27930报文分析|J939分析|友情链接|关于本站','关于本站栏目顺序或标题与主页面不一致');
    assert(aboutItems[6].getAttribute('aria-current')==='page'&&aboutItems[6].classList.contains('active'),'关于本站未标记为当前栏目');
    assert(aboutNav.querySelector('a.nav-item[href="/"]')?.textContent==='CAN报文解析','关于本站导航缺少返回 CAN 报文解析的链接');
    assert(aboutItems.filter(item=>item.classList.contains('pending')&&item.getAttribute('aria-disabled')==='true').length===5,'关于本站未开放栏目缺少禁用语义');
  });

  await record('初始提交号与已选信号提示可见',async()=>{
    assert(/^[0-9a-f]{8}$/i.test(doc.getElementById('hcommit').textContent.trim()),'左上角未显示 8 位提交号');
    assert(doc.getElementById('sigPicked').textContent.trim()==='请先加载DBC文件','已选信号区域初始提示错误');
  });

  await record('iPhone 文件选择器不限制自定义扩展名',async()=>{
    const dbcInput=doc.getElementById('fileDbc');
    const ascInput=doc.getElementById('fileAsc');
    assert(!dbcInput.hasAttribute('accept'),'DBC 文件仍受系统扩展名过滤');
    assert(!ascInput.hasAttribute('accept'),'ASC 文件仍受系统扩展名过滤');
  });

  await record('左上角本地图标预加载且占位固定',async()=>{
    const icon=doc.querySelector('.header-left .icon');
    const preload=doc.querySelector('link[rel="preload"][as="image"][href="icon.png"]');
    assert(icon&&icon.getAttribute('src')==='icon.png','左上角图标未使用本地资源');
    assert(icon.getAttribute('width')==='38'&&icon.getAttribute('height')==='38','图标缺少固定宽高属性');
    assert(icon.loading==='eager'&&icon.getAttribute('decoding')==='sync','图标未启用启动阶段优先加载与同步解码');
    assert(preload&&preload.getAttribute('fetchpriority')==='high','本地图标缺少高优先级预加载');
    assert(icon.getBoundingClientRect().width===38&&icon.getBoundingClientRect().height===38,'图标实际占位不是 38×38 px');
  });

  await record('示例文件解析、绘图和分析',async()=>{
    await api.loadDbcText('sample.dbc',sampleDbc,false);
    await api.loadAscText('sample.asc',sampleAsc,false);
    assert(api.dbc.signals.length===7,'DBC 信号数量错误');
    assert(api.ascFile.sourceOrder.length===1,'示例文件数据源数量错误');
    assert(api.asc.totalMessages===3430,'ASC 报文数量错误');
    api.selectedSet.clear();
    for(const sig of api.dbc.signals)api.selectedSet.add(sig.messageKey+'::'+sig.name);
    api.renderCharts();
    await waitFor(()=>api.charts.length===7);
    assert(api.charts.filter(c=>c._series&&c._series.length).length===7,'曲线生成不完整');
    assert(api.charts[0].getOption().series[0].sampling==='lttb','LTTB 未启用');
    api.renderAnalysis(api.dbc.signals);
    const text=doc.getElementById('analysisPanel').textContent;
    assert(text.includes('未知ID(DBC未定义) 1'),'未知 ID 分析错误');
    assert(text.includes('SensorStuck'),'恒定信号分析缺失');
    const table=doc.querySelector('#analysisPanel .msg-stat-table');
    assert(table,'报文统计未显示帧间隔表格');
    assert(table.textContent.includes('平均帧间隔')&&table.textContent.includes('最小帧间隔')&&table.textContent.includes('最大帧间隔'),'帧间隔表格字段不完整');
  });

  await record('帧间隔按CAN ID统计且单帧不伪造间隔',async()=>{
    const parsed=await api.parseASC([
      '0.000 1 100 Rx d 1 01',
      '0.010 1 100 Rx d 1 02',
      '0.025 1 100 Rx d 1 03',
      '0.030 1 200 Rx d 1 04'
    ].join('\n'));
    const rows=api.messageIntervalStats(parsed.sources['1_Rx']);
    assert(rows.length===2,'未按 CAN ID 分行统计');
    const periodic=rows.find(row=>row.realId===0x100);
    const single=rows.find(row=>row.realId===0x200);
    assert(periodic.frameCount===3,'总帧数统计错误');
    assert(Math.abs(periodic.avgIntervalMs-12.5)<1e-9,'平均帧间隔统计错误');
    assert(Math.abs(periodic.minIntervalMs-10)<1e-9,'最小帧间隔统计错误');
    assert(Math.abs(periodic.maxIntervalMs-15)<1e-9,'最大帧间隔统计错误');
    assert(single.frameCount===1&&single.avgIntervalMs===null&&single.minIntervalMs===null&&single.maxIntervalMs===null,'单帧报文被错误计算出帧间隔');
  });

  await record('移动端生成曲线后自动释放顶部空间并保留全部工具',async()=>{
    const app=doc.getElementById('app');
    const sigBar=doc.getElementById('sigBar');
    const toolbar=doc.getElementById('contentTop');
    assert(app.classList.contains('mobile-charts'),'生成曲线后未进入移动端紧凑模式');
    assert(sigBar.classList.contains('collapsed'),'生成曲线后信号选择区未自动收起');
    assert(win.getComputedStyle(toolbar).overflowX==='auto','曲线工具栏不能横向滚动查看右侧控件');
    assert(doc.getElementById('gYmin')&&doc.getElementById('gYmax'),'移动端工具栏缺少 Y 轴范围输入框');
  });

  await record('移动端可调整信号列宽并手动设置当前曲线Y轴',async()=>{
    const divider=doc.querySelector('.chart-card .cc-divider');
    assert(divider&&win.getComputedStyle(divider).touchAction==='none','信号列分隔条未启用触摸拖动');
    assert(divider.getBoundingClientRect().width>=8,'移动端分隔条触摸热区过窄');
    api.setYTargetChart(api.charts[0]);
    doc.getElementById('gYmin').value='-5';
    doc.getElementById('gYmax').value='105';
    assert(api.applyYRange(),'有效的 Y 轴范围未被应用');
    const yAxis=api.charts[0].getOption().yAxis[0];
    assert(yAxis.min===-5&&yAxis.max===105,'当前曲线 Y 轴范围与输入值不一致');
  });

  await record('无效 ASC 会清空旧状态',async()=>{
    await api.loadAscText('invalid.asc','not an ASC data frame',false);
    assert(api.asc===null,'无效 ASC 后 ascData 未清空');
    assert(api.charts.length===0,'无效 ASC 后旧曲线未清空');
    assert(doc.getElementById('btnStart').disabled,'无效 ASC 后仍可生成曲线');
    assert(doc.getElementById('analysisPanel').textContent==='','无效 ASC 后旧分析未清空');
  });

  await record('ASC 按通道和方向隔离，并拒绝远程帧及变化 DLC',async()=>{
    const multiAsc=[
      '0.000 1 100 Rx d 8 01 00 00 00 00 00 00 00',
      '0.001 2 100 Rx d 8 02 00 00 00 00 00 00 00',
      '0.002 1 100 Tx d 8 03 00 00 00 00 00 00 00',
      '0.003 1 100 Rx r 8',
      '0.004 1 100 Rx d 4 04 00 00 00',
      '0.005 9 111 Rx d 8 01'
    ].join('\n');
    const parsed=await api.parseASC(multiAsc);
    assert(parsed.sourceOrder.length===3,'通道或方向未隔离');
    assert(parsed.totalMessages===3,'无效帧被计入有效报文');
    assert(parsed.rejectedFrames===3,'无效帧计数错误');
    assert(parsed.sources['1_Rx'].totalMessages===1,'变化 DLC 未被拒绝');
    await api.loadAscText('multi.asc',multiAsc,false);
    assert(!doc.getElementById('ascSource').classList.contains('hidden'),'多数据源选择器未显示');
    assert(doc.getElementById('ascSource').options.length===3,'数据源选项数量错误');
  });

  await record('大 ASC 解析会主动让出主线程',async()=>{
    const rows=new Array(40000);
    for(let i=0;i<rows.length;i++) rows[i]=(i/1000).toFixed(3)+' 1 100 Rx d 8 01 02 03 04 05 06 07 08';
    let heartbeat=false;
    setTimeout(()=>{ heartbeat=true; },0);
    const parsed=await api.parseASC(rows.join('\n'));
    assert(heartbeat,'解析期间未让出主线程，页面会出现长时间卡顿');
    assert(parsed.totalMessages===rows.length,'分片解析造成报文丢失');
    const entry=parsed.sources['1_Rx'].map['256_s'];
    assert(entry.times instanceof win.Float64Array&&entry.data instanceof win.Uint8Array,'紧凑数组转换错误');
  });

  await record('大型 ASC 文件会分片读取并跨片拼接数据行',async()=>{
    const text=[
      '0.000 1 100 Rx d 8 01 02 03 04 05 06 07 08',
      '0.001 1 100 Rx d 8 11 12 13 14 15 16 17 18',
      '0.002 1 100 Rx d 8 21 22 23 24 25 26 27 28',
      '0.003 1 100 Rx d 8 31 32 33 34 35 36 37 38'
    ].join('\n');
    const bytes=new TextEncoder().encode(text);
    let slices=0;
    const file={
      size:bytes.length,
      slice(start,end){ slices++; return new Blob([bytes.slice(start,end)]); }
    };
    const parsed=await api.parseASCFile(file,null,null,37);
    assert(slices>1,'大型 ASC 未按切片读取');
    assert(parsed.totalMessages===4,'跨切片的数据行解析不完整');
    const entry=parsed.sources['1_Rx'].map['256_s'];
    assert(entry.times.length===4&&entry.data.length===32,'分片读取后的紧凑数组错误');
    assert(entry.data[8]===0x11&&entry.data[31]===0x38,'切片边界导致数据字节损坏');
  });

  await record('DBC 标准复用信号只解码对应分支',async()=>{
    const dbc=[
      'VERSION ""','BO_ 256 MuxMsg: 8 ECU',
      ' SG_ Selector M : 0|8@1+ (1,0) [0|255] "" ECU',
      ' SG_ BranchA m1 : 8|8@1+ (1,0) [0|255] "" ECU',
      ' SG_ BranchB m2 : 16|8@1+ (1,0) [0|255] "" ECU'
    ].join('\n');
    const asc=[
      '0.000 1 100 Rx d 8 01 0A 63 00 00 00 00 00',
      '0.100 1 100 Rx d 8 02 63 14 00 00 00 00 00'
    ].join('\n');
    await api.loadDbcText('mux.dbc',dbc,false);
    await api.loadAscText('mux.asc',asc,false);
    const a=api.dbc.signals.find(s=>s.name==='BranchA');
    const b=api.dbc.signals.find(s=>s.name==='BranchB');
    const as=api.buildSeries(a),bs=api.buildSeries(b);
    assert(as.length===1&&as[0][1]===10,'m1 分支解码错误');
    assert(bs.length===1&&bs[0][1]===20,'m2 分支解码错误');
  });

  await record('DBC 文本不能注入页面 HTML',async()=>{
    const originalTitle=doc.title;
    const dbc='VERSION ""\nBO_ 1 <img/src=x/onerror=document.title=\'INJECTED\'>: 8 ECU\n SG_ Safe : 0|8@1+ (1,0) [0|255] "<b>unit</b>" ECU';
    await api.loadDbcText('untrusted.dbc',dbc,false);
    await new Promise(r=>setTimeout(r,50));
    assert(doc.title===originalTitle,'DBC 内容执行了脚本');
    assert(doc.querySelector('#sigList img')===null,'DBC 内容被解析为 HTML');
    assert(doc.getElementById('sigList').textContent.includes('<img/src=x'),'报文名未按文本显示');
  });

  await record('超过 53 位的信号不会静默绘制错误数值',async()=>{
    const dbc='VERSION ""\nBO_ 256 Wide: 8 ECU\n SG_ Counter64 : 0|64@1+ (1,0) [0|18446744073709551615] "" ECU';
    const asc='0.000 1 100 Rx d 8 FF FF FF FF FF FF FF FF';
    await api.loadDbcText('wide.dbc',dbc,false);
    await api.loadAscText('wide.asc',asc,false);
    const sig=api.dbc.signals[0];
    assert(sig.precisionUnsupported,'宽信号未标记精度限制');
    assert(api.buildSeries(sig).length===0,'宽信号仍被错误绘制');
  });

  await record('DBC 的零缩放因子保持常量物理值',async()=>{
    const dbc='VERSION ""\nBO_ 256 Constant: 1 ECU\n SG_ Fixed : 0|8@1+ (0,12.5) [12.5|12.5] "V" ECU';
    const parsed=await api.parseDBC(dbc);
    const sig=parsed.signals[0];
    assert(sig.factor===0,'factor=0 被错误替换');
    assert(api.toPhysical(255,sig)===12.5,'零缩放因子未生成恒定物理值');
  });

  await record('超出实际帧 DLC 的信号不会被补零绘制',async()=>{
    const dbc='VERSION ""\nBO_ 256 ShortFrame: 1 ECU\n SG_ BeyondDlc : 8|8@1+ (1,0) [0|255] "" ECU';
    const asc='0.000 1 100 Rx d 1 AA';
    await api.loadDbcText('short.dbc',dbc,false);
    await api.loadAscText('short.asc',asc,false);
    assert(api.buildSeries(api.dbc.signals[0]).length===0,'帧外位被当作零值绘制');
  });

  await record('无有效信号的 DBC 会清空旧状态',async()=>{
    await api.loadDbcText('invalid.dbc','VERSION ""\nCM_ "no messages or signals";',false);
    assert(api.dbc===null,'无效 DBC 被保留为已加载状态');
    assert(doc.getElementById('dbcInfo').textContent==='未加载','无效 DBC 仍显示为已加载');
    assert(doc.getElementById('sigList').textContent.includes('请先加载 DBC 文件'),'无效 DBC 后未恢复初始提示');
    assert(doc.getElementById('btnStart').disabled,'无效 DBC 后仍可生成曲线');
  });

  await record('部署时间选择最新成功的 Workers Build',async()=>{
    const latest=api.latestSuccessfulDeployment([
      {name:'Workers Builds: cananalysis',conclusion:'success',completed_at:'2026-09-05T10:00:00Z'},
      {name:'Workers Builds: cananalysis',conclusion:'failure',completed_at:'2026-09-06T11:00:00Z'},
      {name:'Other Check',conclusion:'success',completed_at:'2026-09-06T12:00:00Z'},
      {name:'Workers Builds: cananalysis',conclusion:'success',completed_at:'2026-09-06T11:48:50Z'}
    ]);
    assert(latest&&latest.completed_at==='2026-09-06T11:48:50Z','未选择最新成功的 Cloudflare 部署');
    api.setReleaseTime(new Date(latest.completed_at),'cloudflare');
    assert(doc.getElementById('hmodtime').dataset.source==='cloudflare','部署时间来源标记错误');
  });

  await record('左上角三行信息异步更新时尺寸保持稳定',async()=>{
    const wrap=doc.querySelector('.htitle-wrap');
    const commit=doc.getElementById('hcommit');
    const release=doc.getElementById('hmodtime');
    const headerRight=doc.querySelector('.header-right');
    const originalCommit=commit.textContent,originalRelease=release.textContent;
    commit.textContent=''; release.textContent='';
    const before={wrapW:wrap.offsetWidth,wrapH:wrap.offsetHeight,rightX:headerRight.getBoundingClientRect().x,headerH:doc.getElementById('header').offsetHeight};
    commit.textContent='12345678'; release.textContent='2026-09-09 19:21:10发布';
    const after={wrapW:wrap.offsetWidth,wrapH:wrap.offsetHeight,rightX:headerRight.getBoundingClientRect().x,headerH:doc.getElementById('header').offsetHeight};
    commit.textContent=originalCommit; release.textContent=originalRelease;
    assert(before.wrapW===132&&before.wrapH===46,'三行文字区域未固定为 132×46 px');
    assert(JSON.stringify(before)===JSON.stringify(after),'提交码或部署时间更新导致头部布局跳动');
  });

  await record('顶部横条启动高亮、当前页与占位提示正确',async()=>{
    const nav=doc.getElementById('topNav');
    const items=Array.from(nav.querySelectorAll('.nav-item'));
    assert(items.map(item=>item.textContent).join('|')==='首页|CAN报文解析|格式转换|27930报文分析|J939分析|友情链接|关于本站','栏目顺序或标题错误');
    assert(items[1].getAttribute('aria-current')==='page'&&items[1].classList.contains('active'),'CAN报文解析未标记为当前栏目');
    const aboutLink=nav.querySelector('a.nav-item[href="/aboutus"]');
    assert(aboutLink?.textContent==='关于本站','主页面导航缺少关于本站链接');
    assert(items.filter(item=>item.classList.contains('pending')&&item.getAttribute('aria-disabled')==='true').length===5,'未开放栏目缺少禁用语义');
    assert(win.getComputedStyle(nav).height==='12px','导航栏默认未处于收缩状态');
    const leftSweep=win.getComputedStyle(nav,'::before');
    const rightSweep=win.getComputedStyle(nav,'::after');
    const peekStyle=win.getComputedStyle(nav.querySelector('.nav-peek'));
    assert(win.matchMedia('(prefers-reduced-motion: reduce)').matches||leftSweep.animationName==='navSweepLeft'&&rightSweep.animationName==='navSweepRight'&&leftSweep.animationDuration==='1s'&&rightSweep.animationDuration==='1s','顶部横条缺少左右向中心聚拢的 1 秒亮色动画');
    assert(peekStyle.animationName==='none','“栏目导航”文字不应执行颜色动画');
    items[0].dispatchEvent(new win.MouseEvent('click',{bubbles:true,clientX:80,clientY:8}));
    const notice=doc.getElementById('navNotice');
    assert(notice.classList.contains('show'),'点击未开放栏目后未显示鼠标旁提示');
    assert(notice.textContent==='页面还未完成开发，不急不急～','未开放栏目提示文字错误');
    assert(Number.isFinite(parseFloat(notice.style.left))&&Number.isFinite(parseFloat(notice.style.top)),'提示未根据点击位置进行定位');
  });

  const list=document.getElementById('results');
  for(const result of tests){
    const item=document.createElement('li');
    item.className=result.ok?'pass':'fail';
    item.textContent=(result.ok?'通过：':'失败：')+result.name+(result.error?' — '+result.error:'');
    list.appendChild(item);
  }
  const passed=tests.filter(t=>t.ok).length;
  const summary=document.getElementById('summary');
  summary.className=passed===tests.length?'pass':'fail';
  summary.textContent=`${passed}/${tests.length} 项通过`;
  window.__TEST_RESULTS__=tests;
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="icon.png" type="image/png" />
<title>CAN报文解析</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3a;
    --txt:#d6dae3; --txt2:#8b93a3; --accent:#4a9eff; --accent2:#3ddc84;
    --warn:#ffb454; --err:#ff6b6b; --info:#9aa4b2;
    --radius:8px;
    --col-name:80px; --col-real:56px; --col-min:48px; --col-max:48px;   /* 侧栏四列宽（可拖动/双击调整） */
    font-family:"Noto Sans CJK SC","Microsoft YaHei","WenQuanYi Micro Hei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--txt);overflow:hidden;}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:6px;padding:6px 12px;font-size:13px;transition:.15s;}
  button:hover:not(:disabled){border-color:var(--accent);color:#fff;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600;}
  button.primary:hover:not(:disabled){filter:brightness(1.1);color:#04121f;}
  .file-row button.primary{color:#fff;}   /* 首次打开加载按钮文字为白色 */
  .file-row button.primary:hover:not(:disabled){color:#04121f;}   /* 悬停统一变黑 */
  button.go{background:var(--accent2);border-color:var(--accent2);color:#042015;font-weight:600;}
  button.go:hover:not(:disabled){filter:brightness(1.1);}
  input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:5px 8px;font-size:13px;font-family:inherit;}
  input:focus{outline:none;border-color:var(--accent);}

  /* layout */
  #app{display:flex;flex-direction:column;height:100%;overflow:hidden;}

  /* header: icon+title on left, file rows on right */
  #header{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;flex-shrink:0;display:flex;align-items:center;gap:20px;}
  .header-left{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .header-left .icon{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff;flex-shrink:0;box-shadow:0 0 0 2px var(--line);}
  .header-left .htitle-wrap{display:flex;flex-direction:column;gap:1px;}
  .header-left .htitle{font-weight:700;font-size:18px;letter-spacing:1px;white-space:nowrap;line-height:1.2;}
  .header-left .hcommit{font-size:10px;color:var(--txt2);white-space:nowrap;line-height:1.1;font-family:Consolas,Menlo,monospace;}
  .header-left .hmodtime{font-size:10px;color:var(--txt2);white-space:nowrap;line-height:1.1;}
  .header-right{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0;}
  .file-row{display:flex;align-items:center;gap:8px;}
  .file-row .finput{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt2);border-radius:6px;padding:5px 10px;font-size:12px;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .file-row .finput.loaded{color:#c9ced9;}   /* 灰白色 */
  .file-row button{white-space:nowrap;padding:5px 14px;font-size:12px;width:110px;text-align:center;}

  /* row 2: signal search & selection (collapsible) */
  #sigBar{background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;transition:flex .2s;}
  /* 展开默认高度：sigBar:content = 3:1，即面板高度为原来的 1.5 倍 */
  #sigBar.expanded{flex:3;min-height:0;}
  #sigBar.expanded.resized{flex:none;}
  #sigBar.collapsed{flex:0 0 auto;}
  #sigResizeHandle{height:5px;flex-shrink:0;background:var(--line);cursor:row-resize;border-top:1px solid var(--line);transition:background .15s;}
  #sigResizeHandle:hover{background:var(--accent);}
  #sigBar.collapsed #sigResizeHandle{display:none;}
  .sig-bar-head{display:flex;align-items:center;gap:8px;padding:7px 16px;flex-wrap:wrap;flex-shrink:0;}
  .sig-toggle{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:13px;font-weight:700;color:#04121f;background:var(--accent);opacity:.4;user-select:none;padding:4px 14px;border-radius:6px;transition:filter .15s,opacity .15s;}
  .sig-toggle:hover{filter:brightness(1.15);}
  .sig-toggle.active{opacity:1;}
  .sig-toggle.active:hover{color:#04121f;}
  .sig-toggle .arrow{display:inline-block;transition:transform .3s;font-size:11px;}
  #sigBar.collapsed .sig-toggle .arrow{transform:rotate(-90deg);}
  .sig-list-wrap{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:row;gap:1px;background:var(--line);transition:opacity .3s ease,max-height .35s ease;}
  #sigBar.collapsed .sig-list-wrap{opacity:0;max-height:0;transition:opacity .15s ease,max-height .35s ease;}
  .sig-col{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--panel);}
  .sig-col-head{font-size:12px;font-weight:600;color:var(--txt2);padding:6px 14px;border-bottom:1px solid var(--line);background:var(--panel2);flex-shrink:0;display:flex;align-items:center;gap:6px;position:relative;}
  .sig-col-head .cnt{flex:1;text-align:center;font-size:11px;color:var(--accent2);}
  .sig-col-head .col-btn{padding:2px 8px;font-size:11px;}
  .sig-col-head .col-btn.active{background:var(--accent);border-color:var(--accent);color:#04121f;}
  .sig-col-body{flex:1;overflow-y:auto;padding:4px 10px;}
  #searchInput{flex:1;min-width:140px;}
  #help{font-size:11px;color:var(--txt2);}
  #help b{color:var(--accent);}
  #help b.g{color:var(--accent2);}
  .selstat{font-size:12px;color:var(--txt2);}
  .selstat b{color:var(--accent2);}
  .sig-item.picked{padding-left:6px;}
  .sig-item.picked .sname{flex:none;white-space:nowrap;}
  .sig-item.picked .sid{color:var(--txt2);font-size:10px;margin-left:6px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .sig-item.picked .sright{margin-left:auto;display:flex;align-items:center;gap:4px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;}
  .sig-item.picked .sright .sunit,.sig-item.picked .sright .smsg{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .sig-item.picked .sright .sunit{color:var(--txt2);font-size:11px;}
  .sig-item.picked .sright .smsg{color:var(--txt2);font-size:10px;}
  #sigPicked{overflow-x:auto;}   /* 极长名称时可横向滚动查看完整内容 */
  .sig-item.picked .drag{flex:none;cursor:grab;color:var(--txt2);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;line-height:1;min-width:16px;padding:2px 4px;border-radius:4px;user-select:none;}
  .sig-item.picked .drag .d-up,.sig-item.picked .drag .d-dn{display:block;height:8px;line-height:8px;}
  .sig-item.picked .drag:hover{color:var(--accent);background:var(--panel2);}
  .sig-item.picked.dragging{background:rgba(74,158,255,0.12);}
  .sig-item.picked.dragging .drag{cursor:grabbing;}
  .sig-item.picked.dragging .sname,
  .sig-item.picked.dragging .sid,
  .sig-item.picked.dragging .sright .sunit,
  .sig-item.picked.dragging .sright .smsg,
  .sig-item.picked.dragging .drag{color:var(--accent);}
  .sig-item .sid{color:var(--txt2);font-size:10px;margin-left:3px;white-space:nowrap;}
  .sig-item .nodata{color:var(--err);font-size:10px;margin-left:3px;}
  .sig-item.pending-remove{opacity:.35;text-decoration:line-through;}
  .msg-group{margin:6px 0 10px;}
  .msg-group .mtitle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);cursor:pointer;padding:3px 4px;border-radius:4px;user-select:none;}
  .msg-group .mtitle:hover{background:var(--panel2);}
  .msg-group .mtitle .id{color:var(--txt2);font-size:11px;}
  .msg-group .mtitle .cnt{margin-left:auto;color:var(--txt2);font-size:11px;}
  .sig-item{display:flex;align-items:center;gap:7px;padding:4px 6px 4px 20px;border-radius:4px;font-size:13px;cursor:pointer;}
  .sig-item:hover{background:var(--panel2);}
  .sig-item input{margin:0;}
  .sig-item .sname{flex:1;}
  .sig-item .sunit{color:var(--txt2);font-size:11px;}
  .sig-item.hasdata .sname::after{content:"●";color:var(--accent2);font-size:9px;margin-left:5px;}
  .empty-hint{color:var(--txt2);font-size:13px;padding:20px;text-align:center;}

  /* content */
  #content{flex:1;display:flex;flex-direction:column;min-height:0;}
  #contentTop{padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:10px;min-height:42px;}
  #contentTop .title{font-size:13px;color:var(--txt2);}
  #contentTop .spacer{flex:1;}
  #analysisWrap{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  #xaxisContainer{flex-shrink:0;padding:0;margin-bottom:0;}
  #xaxisContainer:empty{display:none;}
  #analysisDivider{display:none;height:5px;flex-shrink:0;background:var(--line);cursor:row-resize;border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);z-index:5;}
  #analysisDivider.show{display:block;}
  #analysisPanel{padding:10px 14px;border-top:1px solid var(--line);background:#13161d;flex:1;min-height:0;overflow-y:auto;position:relative;}
  #analysisPanel.hidden{display:none;}
  .ana-btn{display:none;padding:3px 10px;font-size:11px;}
  .ana-btn:not(.hidden){display:inline-block;}
  /* 全屏显示：曲线全屏时连同顶部状态与控制行一起显示 */
  .fs-btn{display:inline-flex;align-items:center;justify-content:center;padding:3px 6px;font-size:11px;}
  .fs-btn svg{width:14px;height:14px;}
  #fsExit{position:fixed;top:8px;right:8px;z-index:95;display:none;align-items:center;justify-content:center;}
  #content.fullscreen{position:fixed;inset:0;z-index:90;background:var(--bg);}
  #content.fullscreen #fsExit{display:inline-flex;}
  #content.fullscreen #chartArea{flex:1 !important;height:auto !important;}
  #content.fullscreen #chartScrollWrap{flex:1 !important;height:auto !important;}
  #content.fullscreen #analysisDivider{display:none !important;}
  #content.fullscreen #analysisPanel{display:none !important;}
  /* 独立信号名称列：与曲线分离，从上往下紧凑排列；表头固定、仅信号行区域滚动 */
  #chartScrollWrap{flex:1;min-height:0;display:flex;flex-direction:row;align-items:stretch;overflow:hidden;margin-top:8px;}   /* 与标题行保留固定小间隙（不随滚动变化） */
  .side-col{width:var(--cc-side-w,120px);flex-shrink:0;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;}   /* 表头与曲线卡片顶部平齐（均在滚动区顶部，间隙恒定） */
  .side-col .sc-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;}
  .side-col .sc-row{display:flex;flex-direction:row;align-items:center;gap:6px;flex:none;height:22px;padding:0 6px;overflow:hidden;}
  .side-col .swatch{width:12px;height:12px;flex:none;border-radius:2px;cursor:pointer;border:1px solid rgba(255,255,255,0.25);}
  .side-col .signame{width:var(--col-name,80px);flex:none;font-weight:400;font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal;cursor:default;position:relative;}
  .side-col .msgtip{display:none;position:absolute;left:100%;top:0;z-index:20;background:#0f1115;border:1px solid var(--accent);border-radius:4px;padding:5px 8px;font-size:11px;color:var(--txt2);white-space:nowrap;pointer-events:none;}
  .side-col .signame:hover .msgtip{display:block;}
  .side-col .liveval{width:var(--col-real,56px);flex:none;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid #4a5566;padding-left:4px;}
  .side-col .liveval .lvval{color:#fff;}
  .side-col .liveval .lvunit{color:#fff;}
  .side-col .stat{flex:none;color:var(--txt2);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:1px solid #4a5566;padding-left:4px;}
  .side-col .stat.c-min{width:var(--col-min,48px);}
  .side-col .stat.c-max{width:var(--col-max,48px);}
  /* 颜色修改框：预设色方格行 + 更多颜色 */
  .color-pop{position:fixed;z-index:120;background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;}
  .color-pop.show{display:block;}
  .color-pop .cp-grid{display:flex;gap:4px;flex-wrap:wrap;max-width:220px;}
  .color-pop .cp-cell{width:20px;height:20px;border-radius:3px;cursor:pointer;border:1px solid rgba(255,255,255,0.25);}
  .color-pop .cp-cell:hover{border-color:var(--accent);transform:scale(1.1);}
  .color-pop .cp-more{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11px;color:var(--txt2);}
  .color-pop .cp-more input[type=color]{width:22px;height:22px;padding:0;border:none;background:none;cursor:pointer;}
  #anaMinimize{position:absolute;top:6px;right:38px;z-index:6;}
  #anaFullscreen{position:absolute;top:6px;right:10px;z-index:6;}
  #analysisPanel.fullscreen{position:fixed;inset:0;z-index:90;background:var(--bg);height:auto !important;}
  /* 默认风格（06c2dffb）：信号侧栏内嵌于曲线卡片，四行（名称/Real/min/max） */
  .cc-side{width:var(--cc-side-w,120px);flex-shrink:0;padding:4px 6px;background:var(--panel2);display:flex;flex-direction:column;gap:2px;font-size:11px;overflow:hidden;justify-content:center;position:relative;}
  .cc-side .signame{font-weight:400;font-size:12px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal;cursor:default;}
  .cc-side .msgtip{display:none;position:absolute;left:100%;top:0;z-index:20;background:#0f1115;border:1px solid var(--accent);border-radius:4px;padding:5px 8px;font-size:11px;color:var(--txt2);white-space:nowrap;pointer-events:none;}
  .cc-side:hover .msgtip{display:block;}
  .cc-side .liveval{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cc-side .liveval .lvlabel{color:var(--txt2);}
  .cc-side .liveval .lvval{color:var(--accent2);}
  .cc-side .liveval .lvunit{color:var(--txt2);}
  .cc-side .stat{color:var(--txt2);font-size:10px;}
  .cc-side .stat b{color:var(--txt);}
  /* 样式切换按钮 */
  .style-toggle{margin-right:2px;padding:3px 10px;font-size:11px;white-space:nowrap;}
  /* 默认风格（06c2dffb）下隐藏独立信号名称列及其分隔线 */
  #app.ui-classic #sideCol{display:none;}
  #app.ui-classic #chartScrollWrap > .cc-divider{display:none;}
  /* 侧栏表头：Name / Real / Min / Max（固定于列表顶部，不随列表滚动） */
  .side-head{display:flex;align-items:stretch;height:16px;width:100%;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line);font-size:10px;font-weight:700;color:var(--txt2);overflow:hidden;padding:0 6px;}
  .side-head .sh-swatch{width:12px;flex:none;}
  .side-head .sh-name{width:var(--col-name,80px);flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;justify-content:center;}
  .side-head .sh-real{width:var(--col-real,56px);flex:none;display:flex;align-items:center;justify-content:center;white-space:nowrap;}
  .side-head .sh-min{width:var(--col-min,48px);flex:none;display:flex;align-items:center;justify-content:center;white-space:nowrap;}
  .side-head .sh-max{width:var(--col-max,48px);flex:none;display:flex;align-items:center;justify-content:center;white-space:nowrap;}
  .side-head .sh-h{flex:none;width:7px;cursor:col-resize;background:transparent;align-self:stretch;position:relative;}
  .side-head .sh-h::before{display:none;}   /* 取消表头间的细竖线（保留拖拽/双击热区） */
  /* global chart controls in sig-bar-head */
  .gctrls{display:none;align-items:center;gap:5px;font-size:11px;}
  .gctrls.show{display:flex;}
  .gctrls .glbl{font-size:11px;color:var(--txt2);}
  .gctrls input[type=number]{width:96px;padding:2px 4px;font-size:11px;}
  .gctrls button{padding:3px 8px;font-size:11px;}
  .gctrls button.active{background:var(--accent);border-color:var(--accent);color:#04121f;}
  .a-summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:12px;}
  .chip b{color:var(--accent);font-weight:600;}
  .chip.err b{color:var(--err);}
  .chip.warn b{color:var(--warn);}
  .a-issues{display:flex;flex-direction:column;gap:6px;}
  .issue{display:flex;gap:8px;font-size:12.5px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);align-items:flex-start;}
  .issue .sev{font-size:14px;line-height:1.2;}
  .issue.err{border-color:#5a2a2a;}
  .issue.warn{border-color:#5a4a20;}
  .issue .tag{color:var(--accent);font-weight:600;}

  #chartArea{padding:0;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;}   /* 顶部无内边距：与标题行间隙恒定（8px），不随滚动变化 */
  .chart-card{background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0;margin-bottom:0;overflow:hidden;display:flex;flex-direction:row;flex:1 1 130px;min-height:130px;}
  .chart-card:first-child{border-top:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;}
  .chart-card:last-child{border-radius:0;}
  /* CANalyzer风格：曲线显示区域左上角改直角；信号列表左上角改圆弧 */
  #app:not(.ui-classic) .chart-card:first-child{border-radius:0 var(--radius) 0 0;}
  #app:not(.ui-classic) .side-head{border-top-left-radius:var(--radius);}
  .xaxis-row{display:flex;flex-direction:row;background:var(--panel);border:1px solid var(--line);border-top:none;border-left:none;border-right:none;border-radius:0;overflow:hidden;flex-shrink:0;position:relative;}   /* 背景与曲线卡片一致，分隔条视觉宽度与上方一致 */
  .xaxis-row .xaxis-spacer{width:var(--cc-side-w,120px);flex-shrink:0;background:var(--panel2);}
  .xaxis-row .xaxis-chart{flex:1;min-width:0;height:22px;}
  .xaxis-unit{position:absolute;left:calc(var(--cc-side-w,120px) + 11px);top:2px;line-height:1;font-size:12px;color:var(--txt2);white-space:nowrap;pointer-events:none;}
  /* 跨图表十字线 SVG 覆盖层 */
  #crosshairOverlay{position:absolute;inset:0;pointer-events:none;z-index:8;display:none;}
  #crosshairOverlay.show{display:block;}
  #crosshairOverlay svg{width:100%;height:100%;}
  .cc-divider{width:2.5px;flex-shrink:0;cursor:col-resize;background:var(--line);transition:background .15s;}   /* 分界线宽度=原5px的一半 */
  #analysisWrap.divider-hover .cc-divider{background:var(--accent);}
  .cc-body{flex:1;min-width:0;display:flex;flex-direction:column;}
  .chart{width:100%;height:100%;flex:1;min-height:0;}
  /* flash animation for valid clicks */
  @keyframes flash{0%{background:var(--accent);color:#04121f;}100%{}}
  .flash{animation:flash .35s ease;}

  #dropZone{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;}
  #dropZone.show{display:flex;}
  #dropZone .box{background:var(--panel);border:2px dashed var(--accent);border-radius:12px;padding:40px 60px;font-size:18px;color:var(--accent);}

  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);color:var(--txt);padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;}
  #toast.show{opacity:1;}
  #loadingOverlay{position:fixed;inset:0;background:rgba(8,10,14,.75);display:none;align-items:center;justify-content:center;z-index:70;flex-direction:column;gap:14px;}
  #loadingOverlay.show{display:flex;}
  #loadingOverlay .spin{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loadingOverlay .txt{color:var(--txt);font-size:14px;}
  #progressBar{width:280px;height:6px;background:var(--line);border-radius:4px;overflow:hidden;}

<script>
"use strict";
/* ============================================================
 * CAN 信号波形分析工具
 *  - DBC 解析 (BO_/SG_/VAL_)
 *  - ASC 解析 (按ID分组, 紧凑存储)
 *  - 信号提取 (Intel/Motorola 位序, 符号, factor/offset, 枚举)
 *  - 多曲线纵向堆叠, 横轴滚轮同步, 纵轴独立
 *  - 自动分析统计与问题检测
 * ============================================================ */

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; };

let dbcData = null;     // {messages, signals}
let ascData = null;     // {map, totalMessages, tMin, tMax, unknownIds, idOrder}
let charts = [];        // echarts instances
let xAxisChart = null;  // shared x-axis chart at bottom
let syncing = false;
let lastX = {start:0, end:100};

/* ---------- DBC parser (async chunked, 可取消) ---------- */
function parseDBC(text, isCancelled){
  const messages = {};
  const lines = text.split(/\r?\n/);
  let cur = null;
  const CHUNK = 50000;
  let i = 0;
  return new Promise(resolve=>{
    function step(){
      const end = Math.min(i+CHUNK, lines.length);
      for(; i<end; i++){
        const line = lines[i].trim();
        if(line.startsWith('BO_ ')){
          const m = line.match(/^BO_\s+(\d+)\s+(\S+)\s*:\s*(\d+)\s*(\S+)/);
          if(m){
            const id = parseInt(m[1],10);
            const isExt = (id & 0x80000000)!==0;
            const realId = id & 0x1FFFFFFF;
            cur = { id, realId, isExt, key: realId+'_'+(isExt?'x':'s'),
                    name:m[2], dlc:parseInt(m[3],10), sender:m[4], signals:[] };
            messages[cur.key]=cur;
          }
        } else if(line.startsWith('SG_ ')){
          const m = line.match(/^SG_\s+(\w+)\s*(?:(M|m\d+)\s*)?:\s*(\d+)\|(\d+)@(\d)([+-])\s*\(([^,]+),([^)]+)\)\s*\[([^|]+)\|([^\]]+)\]\s*"([^"]*)"\s*(.*)$/);
          if(m && cur){
            const sig = {
              name:m[1], mux:m[2]||null,
              startBit:parseInt(m[3],10), length:parseInt(m[4],10),
              byteOrder:parseInt(m[5],10), isSigned:m[6]==='-',
              factor:parseFloat(m[7]), offset:parseFloat(m[8]),
              min:parseFloat(m[9]), max:parseFloat(m[10]),
              unit:m[11]||'', receivers:(m[12]||'').trim(),
              messageName:cur.name, messageId:cur.id, messageKey:cur.key,
              valueTable:null
            };
            if(!isFinite(sig.factor)||sig.factor===0) sig.factor=1;
            if(!isFinite(sig.offset)) sig.offset=0;
            if(!isFinite(sig.min)) sig.min=-Infinity;
            if(!isFinite(sig.max)) sig.max=Infinity;
            cur.signals.push(sig);
          }
        } else if(line.startsWith('VAL_ ')){
          const m = line.match(/^VAL_\s+(\d+)\s+(\w+)\s+(.*);$/);
          if(m){
            const id=parseInt(m[1],10);
            const isExt=(id&0x80000000)!==0;
            const realId=id&0x1FFFFFFF;
            const key=realId+'_'+(isExt?'x':'s');
            const msg=messages[key];
            if(msg){
              const sig=msg.signals.find(s=>s.name===m[2]);
              if(sig){
                const table={};
                const re=/(-?\d+)\s+"([^"]*)"/g; let pm;
                while((pm=re.exec(m[3]))!==null) table[parseInt(pm[1],10)]=pm[2];
                sig.valueTable=table;
              }
            }
          }
        }
      }
      if(isCancelled && isCancelled()){ resolve({cancelled:true}); return; }
      if(i<lines.length){ setTimeout(step,0); }
      else{
        const signals=[];
        Object.values(messages).forEach(msg=>msg.signals.forEach(s=>signals.push(s)));
        resolve({messages, signals});
      }
    }
    step();
  });
}

/* ---------- raw value extraction ----------
 * DBC standard: byteOrder 0 = Motorola (big-endian), 1 = Intel (little-endian)
 * Intel: startBit = LSB position, bits go startBit, startBit+1, ...
 * Motorola: startBit = MSB position, bits go in decreasing order within byte,
 *           wrapping from bit 0 of byte N to bit 7 of byte N+1
 */
function extractRawAt(data, base, dlc, sig){
  const {startBit, length, byteOrder} = sig;
  let value=0;
  if(length<=32){
    if(byteOrder===1){ // Intel LE (DBC @1)
      let bp=startBit;
      for(let i=0;i<length;i++){
        const bi=bp>>>3;
        const bit = (bi<dlc) ? ((data[base+bi]>>>(bp&7))&1) : 0;
        value |= bit<<i;
        bp++;
      }
    } else { // Motorola BE (DBC @0)
      let bp=startBit;
      for(let i=0;i<length;i++){
        const bi=bp>>>3;
        const bit = (bi<dlc) ? ((data[base+bi]>>>(bp&7))&1) : 0;
        value |= bit<<(length-1-i);
        if((bp&7)===0) bp+=15; else bp-=1;
      }
    }
    value = value>>>0;
  } else {
    if(byteOrder===1){ // Intel LE
      let bp=startBit;
      for(let i=0;i<length;i++){ const bi=bp>>>3; const bit=(bi<dlc)?((data[base+bi]>>>(bp&7))&1):0; value+=bit*Math.pow(2,i); bp++; }
    } else { // Motorola BE
      let bp=startBit;
      for(let i=0;i<length;i++){ const bi=bp>>>3; const bit=(bi<dlc)?((data[base+bi]>>>(bp&7))&1):0; value+=bit*Math.pow(2,length-1-i); if((bp&7)===0)bp+=15;else bp-=1; }
    }
  }
  return value;
}
function toPhysical(raw, sig){
  if(sig.isSigned){
    const signVal=Math.pow(2,sig.length-1);
    if(raw>=signVal) raw-=Math.pow(2,sig.length);
  }
  return raw*sig.factor+sig.offset;
}

/* ---------- ASC parser (async chunked, 可取消) ---------- */
async function parseASC(text, onProgress, isCancelled){
  const lines = text.split(/\r?\n/);
  const total = lines.length;
  const map = {};           // key -> {times:[], data:[], dlc, isExt, name?}
  const idOrder = [];
  let totalMessages=0, tMin=Infinity, tMax=-Infinity;
  const ASC_RE = /^\s*([0-9]+\.?[0-9]*(?:e[-+]?[0-9]+)?)\s+(\d+)\s+([0-9A-Fa-f]+)(x?)\s+(Rx|Tx)\s+\S+\s+(\d+)\s*(.*)$/;
  const CHUNK=40000;
  let i=0;
  return new Promise(resolve=>{
    function step(){
      if(isCancelled && isCancelled()){ resolve({cancelled:true}); return; }
      const end=Math.min(i+CHUNK,total);
      for(; i<end; i++){
        const line=lines[i];
        if(!line) continue;
        const c=line[0];
        if(c==='/'||c===';'||c==='#'||c===' ') {
          // still try regex for indented lines
        }
        const m=line.match(ASC_RE);
        if(!m) continue;
        const t=parseFloat(m[1]);
        if(!isFinite(t)) continue;
        const realId=parseInt(m[3],16);
        const isExt=m[4]==='x';
        const dlc=parseInt(m[6],10);
        if(!isFinite(realId)||dlc<=0||dlc>64) continue;
        const key=realId+'_'+(isExt?'x':'s');
        let entry=map[key];
        if(!entry){
          entry={times:[], data:[], dlc, isExt, realId};
          map[key]=entry; idOrder.push(key);
        }
        const stride=entry.dlc;
        // parse bytes
        const rest=m[7]||'';
        const toks=rest.split(/\s+/);
        let bidx=0;
        for(const tk of toks){
          if(/^[0-9A-Fa-f]{1,2}$/.test(tk)){
            if(bidx<stride){ entry.data.push(parseInt(tk,16)); bidx++; }
          }
        }
        while(bidx<stride){ entry.data.push(0); bidx++; }
        entry.times.push(t);
        if(t<tMin) tMin=t;
        if(t>tMax) tMax=t;
        totalMessages++;
      }
      if(onProgress) onProgress(i/total);
      if(i<total){ setTimeout(step,0); }
      else {
        // finalize: convert to typed arrays
        for(const k of idOrder){
          const e=map[k];
          e.times=new Float64Array(e.times);
          e.data=new Uint8Array(e.data);
          e.count=e.times.length;
        }
        resolve({map, totalMessages, tMin, tMax, idOrder});
      }
    }
    step();
  });
}

/* ---------- build series ---------- */
function buildSeries(sig){
  const md=ascData.map[sig.messageKey];
  if(!md) return [];
  const n=md.times.length;
  const out=new Array(n);
  const dlc=md.dlc;
  for(let i=0;i<n;i++){
    const raw=extractRawAt(md.data, i*dlc, dlc, sig);
    out[i]=[md.times[i], toPhysical(raw,sig)];
  }
  return out;
}
/* 分片异步构建序列：让出主线程，保证取消按钮与页面及时响应 */
function buildSeriesChunked(sig, cb, check, onCancel){
  const md=ascData.map[sig.messageKey];
  if(!md){ cb([]); return; }
  const n=md.times.length;
  const out=new Array(n);
  const dlc=md.dlc;
  const SLICE=50000;
  let i=0;
  function step(){
    if(check && check()){ if(onCancel) onCancel(); return; }
    const end=Math.min(i+SLICE,n);
    for(;i<end;i++){
      const raw=extractRawAt(md.data, i*dlc, dlc, sig);
      out[i]=[md.times[i], toPhysical(raw,sig)];
    }
    if(i<n){ setTimeout(step,0); }
    else cb(out);
  }
  step();
}

/* ---------- stats & analysis ---------- */
function median(arr){
  if(!arr.length) return 0;
  const s=arr.slice().sort((a,b)=>a-b);
  const m=s.length>>1;
  return s.length&1 ? s[m] : (s[m-1]+s[m])/2;
}
function computeStats(series, sig){
  if(!series.length) return {count:0};
  let min=Infinity,max=-Infinity,sum=0,outRange=0;
  const first=series[0][1]; let allSame=true;
  for(let k=0;k<series.length;k++){
    const v=series[k][1];
    if(v<min)min=v; if(v>max)max=v; sum+=v;
    if(v!==first) allSame=false;
    if(v<sig.min||v>sig.max) outRange++;
  }
  const mean=sum/series.length;
  let sq=0; for(let k=0;k<series.length;k++){ const d=series[k][1]-mean; sq+=d*d; }
  const std=Math.sqrt(sq/series.length);
  return {count:series.length,min,max,mean,std,outRange,allSame,
          t0:series[0][0],t1:series[series.length-1][0],
          duration:series[series.length-1][0]-series[0][0]};
}
/* 分片异步计算统计：让出主线程，保证取消按钮与页面及时响应 */
function computeStatsChunked(series, sig, cb, check, onCancel){
  const n=series.length;
  if(!n){ cb({count:0}); return; }
  const SLICE=50000;
  let idx=0, min=Infinity,max=-Infinity,sum=0,outRange=0;
  const first=series[0][1]; let allSame=true;
  function pass1(){
    if(check && check()){ if(onCancel) onCancel(); return; }
    const end=Math.min(idx+SLICE,n);
    for(;idx<end;idx++){
      const v=series[idx][1];
      if(v<min)min=v; if(v>max)max=v; sum+=v;
      if(v!==first) allSame=false;
      if(v<sig.min||v>sig.max) outRange++;
    }
    if(idx<n){ setTimeout(pass1,0); return; }
    const mean=sum/n;
    idx=0; let sq=0;
    function pass2(){
      if(check && check()){ if(onCancel) onCancel(); return; }
      const e2=Math.min(idx+SLICE,n);
      for(;idx<e2;idx++){ const d=series[idx][1]-mean; sq+=d*d; }
      if(idx<n){ setTimeout(pass2,0); return; }
      const std=Math.sqrt(sq/n);
      cb({count:n,min,max,mean,std,outRange,allSame,
          t0:series[0][0],t1:series[n-1][0],
          duration:series[n-1][0]-series[0][0]});
    }
    pass2();
  }
  pass1();
}
function analyzeGaps(md){
  if(!md||md.times.length<4) return null;
  const n=md.times.length; const intervals=[];
  for(let i=1;i<n;i++) intervals.push(md.times[i]-md.times[i-1]);
  const med=median(intervals);
  let maxGap=0;
  for(const g of intervals) if(g>maxGap) maxGap=g;
  // count gaps > 3x median
  let bigGaps=0;
  if(med>0){ for(const g of intervals) if(g>med*3) bigGaps++; }
  return {med, maxGap, bigGaps, n};
}

/* ---------- file loading ---------- */
function readText(file, onProg){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const buf=new Uint8Array(r.result);
      /* 自动检测编码：先尝试 UTF-8（fatal 模式），失败则回退 GBK（中文 Windows 常见），
         再失败则回退 Latin-1。解决 DBC 文件中 "℃" 等非 ASCII 字符乱码问题。 */
      try{
        resolve(new TextDecoder('utf-8',{fatal:true}).decode(buf));
      }catch(e){
        try{
          resolve(new TextDecoder('gbk',{fatal:false}).decode(buf));
        }catch(e2){
          resolve(new TextDecoder('latin1',{fatal:false}).decode(buf));
        }
      }
    };
    r.onerror=()=>reject(r.error);
    if(onProg) r.onprogress=e=>onProg(e.loaded/(e.total||1));
    r.readAsArrayBuffer(file);
  });
}
function showLoading(txt, prog){
  $('loadingOverlay').classList.add('show');
  if(txt) $('loadTxt').textContent=txt;
  if(prog!=null) document.querySelector('#progressBar > div').style.width=(prog*100).toFixed(0)+'%';
}
function hideLoading(){ $('loadingOverlay').classList.remove('show'); document.querySelector('#progressBar > div').style.width='0'; }
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200);
}
/* ---------- 长任务管理：输入拦截 + 动画 + 计时 + 取消 + 30s超时 ----------
 * opts.immediate=true 时立即显示动画（不等待500ms）
 * opts.minMs        最短显示时长（毫秒），避免快速动作动画一闪而过 */
let busyState = null;
let busyGen = 0;
function startBusy(text, cancelFn, opts){
  opts = opts || {};
  if(busyState) cleanupBusy();
  const gen = ++busyGen;
  const token = {cancelled:false};
  const ov = $('busyOverlay');
  busyState = {
    gen, token,
    startTime: Date.now(),
    cancelFn,
    minMs: opts.minMs || 0,
    showTimer: opts.immediate ? null : setTimeout(()=>{
      if(busyState && busyState.gen===gen){
        $('busyText').textContent = text;
        $('busyTimer').textContent = '0 s';
        ov.classList.add('show');
      }
    }, 500),
    watchdog: setTimeout(()=>{
      if(busyState && busyState.gen===gen) showBusy30Dialog();
    }, 30000),
    clock: setInterval(()=>{
      if(busyState && busyState.gen===gen) $('busyTimer').textContent = Math.floor((Date.now()-busyState.startTime)/1000)+' s';
    }, 250)
  };
  ov.classList.add('blocking');   // 立即拦截鼠标/滚轮输入
  if(opts.immediate){
    $('busyText').textContent = text;
    $('busyTimer').textContent = '0 s';
    ov.classList.add('show');
  }
  return token;
}
function cleanupBusy(){
  if(!busyState) return;
  clearTimeout(busyState.showTimer);
  clearTimeout(busyState.watchdog);
  clearTimeout(busyState.hideTimer);
  clearInterval(busyState.clock);
  $('busyOverlay').classList.remove('blocking','show');
  $('confirmOverlay').classList.remove('show');
  busy30Open = false;
  busyState = null;
}
function finishBusy(){
  if(!busyState) return;
  const remain = busyState.minMs - (Date.now() - busyState.startTime);
  const gen = busyState.gen;
  if(remain > 0){
    clearTimeout(busyState.hideTimer);
    busyState.hideTimer = setTimeout(()=>{
      if(busyState && busyState.gen===gen) cleanupBusy();
    }, remain);
  } else {
    cleanupBusy();
  }
}
$('busyCancel').onclick=()=>{
  if(!busyState) return;
  busyState.token.cancelled = true;
  const fn = busyState.cancelFn;
  cleanupBusy();
  if(fn) fn('cancel');
  toast('已取消当前动作');
};

function renderSignalList(){
  const list=$('sigList'); list.innerHTML='';

    if(filterEmpty){ sigs=sigs.filter(s=> ascData && ascData.map[s.messageKey]); }

function renderPickedList(){
  const picked=$('sigPicked'); picked.innerHTML='';
  if(!dbcData){ picked.innerHTML='<div class="empty-hint">请先加载 DBC 文件</div>'; $('pickedCount').textContent='0'; return; }
  const sigs=selectedSignals();
  $('pickedCount').textContent=selectedSet.size;
  if(!sigs.length){ picked.innerHTML='<div class="empty-hint">勾选左侧信号后自动出现在此</div>'; return; }
  /* 测量最长名称宽度（无数据信号按"名称+[无数据]"一起计入，避免徽标与ID重叠），名称定宽使ID列对齐 */
  const tmp=document.createElement('span');
  tmp.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;font-size:13px;';
  picked.appendChild(tmp);
  let maxW=0;
  for(const s of sigs){
    const has = ascData && ascData.map[s.messageKey];
    tmp.textContent = has ? s.name : s.name+'[无数据]';
    maxW=Math.max(maxW,tmp.offsetWidth);
  }
  tmp.remove();
  const nameMinW=Math.ceil(maxW+6)+'px';
  for(const s of sigs){
    const has = ascData && ascData.map[s.messageKey];
    const it=el('div','sig-item picked'+(has?' hasdata':''));
    const cb=document.createElement('input'); cb.type='checkbox'; cb.dataset.key=s.messageKey+'::'+s.name;
    cb.checked=true;
    cb.addEventListener('change',()=>{
      if(!cb.checked){
        it.classList.add('pending-remove');
        selectedSet.delete(cb.dataset.key);
        const leftCb=findLeftCb(cb.dataset.key);
        if(leftCb) leftCb.checked=false;
      } else {
        it.classList.remove('pending-remove');
        selectedSet.add(cb.dataset.key);
        const leftCb=findLeftCb(cb.dataset.key);
        if(leftCb) leftCb.checked=true;
      }
      updateSelCount();
    });
    const realId=s.messageId & 0x1FFFFFFF;
    const isExt=(s.messageId & 0x80000000)!==0;
    const span=el('span','sname',s.name);
    span.style.width=nameMinW;   /* 名称列=最长名称宽度，完整显示且ID列对齐 */
    if(ascData && !has) span.appendChild(el('span','nodata','[无数据]'));
    const sid=el('span','sid',fmtId(realId,isExt));
    const sright=el('span','sright');
    const unit=el('span','sunit',s.unit?('['+s.unit+']'):'');
    const msgInfo=el('span','smsg',s.messageName);
    sright.append(unit,msgInfo);
    /* 拖动排序：排序手柄或整行长按/移动均可进入拖动 */
    const drag=el('span','drag');
    const dUp=document.createElement('span'); dUp.className='d-up'; dUp.textContent='▲';
    const dDn=document.createElement('span'); dDn.className='d-dn'; dDn.textContent='▼';
    drag.append(dUp,dDn);
    drag.title='拖动排序';
    let sigDragActive=false;
    const startSigDrag=(e)=>{
      if(e.button!==0||sigDragActive) return;
      sigDragActive=true;
      e.preventDefault();
      e.stopPropagation();
      it.classList.add('dragging');
      it.style.position='relative';
      it.style.zIndex='5';
      document.body.style.userSelect='none';
      const startY=e.clientY;
      const grabOffset=startY-it.getBoundingClientRect().top;   /* 光标相对项顶部的距离 */
      let curTransform=0;
      let lastClientY=0;
      let scrollTimer=null;
      const stopScroll=()=>{ if(scrollTimer){ clearInterval(scrollTimer); scrollTimer=null; } };
      /* 更新位移 + 插入点（可被移动事件与自动滚动复用） */
      const applyDrag=(clientY)=>{
        const renderedTop=it.getBoundingClientRect().top;
        const layoutTop=renderedTop-curTransform;
        const desiredTop=clientY-grabOffset;
        curTransform=desiredTop-layoutTop;
        /* 项已在第一位时不再向上位移（避免被拖出窗口上边沿消失） */
        if(picked.firstElementChild===it && curTransform<0) curTransform=0;
        /* 项已在最后一位时不再向下位移，避免列表下方出现大片空白 */
        if(picked.lastElementChild===it && curTransform>0) curTransform=0;
        it.style.transform='translateY('+curTransform+'px)';
        const itMid=it.getBoundingClientRect().top+it.getBoundingClientRect().height/2;
        let insertBeforeEl=null;
        for(const s of picked.children){
          if(s===it) continue;
          const r=s.getBoundingClientRect();
          if(itMid<r.top+r.height/2){ insertBeforeEl=s; break; }
        }
        if(insertBeforeEl) picked.insertBefore(it,insertBeforeEl);
        else picked.appendChild(it);
      };
      const onMove=ev=>{
        lastClientY=ev.clientY;
        applyDrag(ev.clientY);
        /* 拖动到容器上/下边缘时自动滚动列表，滚到边界即停止 */
        const box=picked.getBoundingClientRect();
        const zone=28;
        const atEdge=(lastClientY<box.top+zone)||(lastClientY>box.bottom-zone);
        if(atEdge && !scrollTimer){
          scrollTimer=setInterval(()=>{
            const b=picked.getBoundingClientRect();
            const atTop=picked.scrollTop<=0;
            const atBottom=picked.scrollTop+picked.clientHeight>=picked.scrollHeight-1;
            if(lastClientY<b.top+zone){ if(!atTop) picked.scrollTop-=12; }
            else if(lastClientY>b.bottom-zone){ if(!atBottom) picked.scrollTop+=12; }
            else{ stopScroll(); return; }
            applyDrag(lastClientY);
          },40);
        }else if(!atEdge){
          stopScroll();
        }
      };
      const onUp=()=>{
        stopScroll();
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        document.removeEventListener('pointermove',onMove);
        document.removeEventListener('pointerup',onUp);
        document.body.style.userSelect='';
        it.style.transform='';
        it.style.zIndex='';
        it.classList.remove('dragging');
        sigDragActive=false;
        /* 提交新顺序到 selectedSet */
        const keys=Array.from(picked.children).map(x=>x.querySelector('input').dataset.key);
        selectedSet.clear();
        keys.forEach(k=>selectedSet.add(k));
        sigOrderChanged=true;
        updateSelCount();
        /* 抑制紧随其后的 click 事件误触勾选 */
        it._dragJustEnded=true;
        setTimeout(()=>{ it._dragJustEnded=false; }, 150);
      };
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
      document.addEventListener('pointermove',onMove);
      document.addEventListener('pointerup',onUp);
    };
    drag.addEventListener('mousedown',startSigDrag);
    drag.addEventListener('pointerdown',startSigDrag);
    drag.addEventListener('click',e=>e.stopPropagation());
    /* 整行：长按400ms或快速移动进入拖动排序；单击仍切换勾选（取消选择） */
    let pressTimer=null;
    let pressActive=false;
    const cancelPress=()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
    const enterDragByEvent=(ev)=>{
      if(!sigDragActive) startSigDrag({clientY:ev.clientY, button:0, preventDefault(){}, stopPropagation(){}});
    };
    const onRowPress=(e)=>{
      if(e.button!==0||e.target.closest('.drag')||e.target.tagName==='INPUT'||pressActive) return;
      pressActive=true;
      const sx=e.clientX, sy=e.clientY;
      let cleaned=false;
      const cleanup=()=>{
        if(cleaned) return;
        cleaned=true;
        cancelPress();
        pressActive=false;
        document.removeEventListener('mousemove',onPressMove);
        document.removeEventListener('mouseup',onPressUp);
        document.removeEventListener('pointermove',onPressMove);
        document.removeEventListener('pointerup',onPressUp);
      };
      const onPressMove=ev=>{
        if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>5){
          cancelPress();
          enterDragByEvent(ev);
          cleanup();
        }
      };
      const onPressUp=()=>{ cleanup(); };
      pressTimer=setTimeout(()=>{ enterDragByEvent({clientY:sy}); cleanup(); }, 400);
      document.addEventListener('mousemove',onPressMove);
      document.addEventListener('mouseup',onPressUp);
      document.addEventListener('pointermove',onPressMove);
      document.addEventListener('pointerup',onPressUp);
    };
    it.addEventListener('mousedown',onRowPress);
    it.addEventListener('pointerdown',onRowPress);
    it.append(cb,span,sid,sright,drag);
    it.addEventListener('click',e=>{ if(it._dragJustEnded||e.target.closest('.drag')) return; if(e.target!==cb){ cb.checked=!cb.checked; cb.dispatchEvent(new Event('change')); } });
    picked.appendChild(it);
  }
}

function buildTooltip(sig){

    const p=params[0];
    if(!p) return '';
    let v=p.value[1];
    let extra='';
    if(sig.valueTable){
      const raw=Math.round((v-sig.offset)/(sig.factor||1));
      if(sig.valueTable[raw]!=null) extra=` <span style="color:#9aa4b2">(${sig.valueTable[raw]})</span>`;
    }
    return `<div style="font-size:12px">${sig.name} = <b>${typeof v==='number'?fmtSigValue(v, sig):v}</b> ${sig.unit}${extra}</div>`;
  };

/* 测量某列内容的最宽显示宽度（real 以 max 值+单位为参考） */
function measureColumn(col){

/* 侧栏总宽 = 四列宽度之和 + 左右内边距(12)与列间间距(24)及色块(12)，列宽变化后调用 */
function updateSideTotal(){
  const cs=getComputedStyle(document.documentElement);
  const n=parseFloat(cs.getPropertyValue('--col-name'))||80;
  const r=parseFloat(cs.getPropertyValue('--col-real'))||56;
  const m=parseFloat(cs.getPropertyValue('--col-min'))||48;

function renderCharts(){

        <span class="swatch" title="点击选择曲线颜色"></span>
        ${has?`<span class="liveval"><span class="lvval"></span></span><span class="stat c-min">${fmtSigValue(stats.min, sig)}</span><span class="stat c-max">${fmtSigValue(stats.max, sig)}</span>`:`<span class="liveval"><span class="lvval">无数据</span></span><span class="stat c-min"></span><span class="stat c-max"></span>`}`;

/* 跨图表数据点方框 + Real 实时值 + 底部时间标签 + 点击固定竖线：
   独立 SVG 覆盖层 + 全局鼠标监听，完全不依赖 ECharts 内部指针机制 */
function nearestIndex(series, t){
  if(!series || !series.length) return -1;
  let lo=0, hi=series.length-1, best=-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    if(series[mid][0]<=t){ best=mid; lo=mid+1; } else hi=mid-1;
  }
  return best;
}
/* 距离鼠标水平时间最近的圆点索引（在左右两个数据点之间取较近者） */
function nearestDataIdx(series, t){
  const idx = nearestIndex(series, t);
  if(idx < 0) return 0;
  if(idx+1 < series.length && series[idx+1][0] - t < t - series[idx][0]) return idx+1;
  return idx;
}
/* 依据DBC信号分辨率(factor)确定小数位数：factor=1→0位，factor=0.1→1位，factor=0.01→2位 */
function factorDecimals(factor){
  if(!factor || factor<=0 || !isFinite(factor)) return 0;
  const s = String(factor).toLowerCase();
  const e = s.indexOf('e');
  if(e >= 0){
    const m = s.match(/^(\d+(?:\.\d+)?)e([+-]?\d+)$/);
    if(m){
      const mantDec = m[1].indexOf('.') >= 0 ? m[1].length - m[1].indexOf('.') - 1 : 0;
      const exp = parseInt(m[2], 10);
      return Math.max(0, mantDec - exp);
    }
    return 0;
  }
  const i = s.indexOf('.');
  return i < 0 ? 0 : s.length - i - 1;
}
function fmtSigValue(v, sig){
  if(v==null || !isFinite(v)) return '';
  return v.toFixed(factorDecimals(sig && sig.factor));
}
function getSeriesValueAt(c, t){
  const series = c._series;
  if(!series || !series.length) return null;
  const idx = nearestDataIdx(series, t);
  if(idx<0 || idx>=series.length) return null;
  const p = series[idx];
  return (p && p[1]!=null) ? p[1] : null;
}
function setLiveReal(c, t){
  const lv = c._liveEl;
  if(!lv) return;
  const v = getSeriesValueAt(c, t);
  const valEl = lv.querySelector('.lvval');
  if(!valEl) return;
  valEl.innerHTML = '';
  if(v==null) return;
  const num = document.createElement('span');
  num.className = 'lvnum';
  num.textContent = fmtSigValue(v, c._sig);   /* 按DBC分辨率精度 */
  valEl.appendChild(num);
  valEl.appendChild(document.createTextNode(' '));
  const unit = document.createElement('span');
  unit.className = 'lvunit';
  unit.textContent = c._sig.unit || '';
  valEl.appendChild(unit);
}
let curXMin = 0, curXMax = 1;   // 当前X轴显示范围（随缩放同步）
const SVG_NS = 'http://www.w3.org/2000/svg';
let pinned = null;              // 点击固定的时间点（null=未固定）
let pinnedChart = null;         // 固定时悬停的图表实例
let hoveredChart = null;        // 当前悬停的图表实例
let lastT = null;               // 最近悬停时间
let lastOverlayX = 0;           // 最近悬停位置（相对覆盖层）
let lastClientX = 0, lastClientY = 0;   // 鼠标最近屏幕位置（判断离开方向用）
let moveHist = [];                      // 最近鼠标移动轨迹（用于离开方向判定）
/* 曲线显示区域边界（chartArea 顶部 → 底部横轴底部），竖线只在此区域内贯穿 */
function crosshairRegion(ovRect){
  let top = 0, bottom = ovRect.height;
  const ca = $('chartArea');
  if(ca){ const r = ca.getBoundingClientRect(); top = r.top - ovRect.top; }
  const xa = $('xaxisContainer');
  if(xa){ const r = xa.getBoundingClientRect(); bottom = r.bottom - ovRect.top; }
  return {top, bottom};
}
/* 将覆盖层裁剪区更新为曲线显示区域，竖线/方框/标签均不越界 */
function applyCrosshairClip(reg){
  const cr = $('chClipRect');
  if(!cr) return;
  cr.setAttribute('y', reg.top);
  cr.setAttribute('height', reg.bottom - reg.top);
}
function setupCrosshair(){
  if($('crosshairOverlay')) return;   // 已创建过，避免重复

  ov.id = 'crosshairOverlay';
  const svg = document.createElementNS(SVG_NS,'svg');

  svg.append(clipDefs, clipGroup);
  ov.appendChild(svg);
  $('analysisWrap').appendChild(ov);

  const drawBox = (c, t, ovRect)=>{
    const box = c._boxEl;
    if(!box) return;
    const series = c._series;
    if(!series || !series.length){ box.setAttribute('display','none'); return; }
    const idx = nearestDataIdx(series, t);
    const p = series[idx];
    if(!p || p[1]==null){ box.setAttribute('display','none'); return; }
    const px = c.convertToPixel({xAxisIndex:0}, p[0]);   // 数据点自身时间，精确落在圆点上
    const py = c.convertToPixel({yAxisIndex:0}, p[1]);
    if(px==null || py==null || !isFinite(px) || !isFinite(py)){ box.setAttribute('display','none'); return; }

    if(cr.bottom < ovRect.top || cr.top > ovRect.bottom){ box.setAttribute('display','none'); return; }
    const bx = cr.left - ovRect.left + px;   // 方框精确落在数据圆点上（不随竖线偏移）
    const by = cr.top - ovRect.top + py;
    box.setAttribute('width','10');          // 保持方框原有大小（切换圆点显示不影响）
    box.setAttribute('height','10');
    box.setAttribute('display','block');
    box.setAttribute('x', bx-5);
    box.setAttribute('y', by-5);
  };
  const hideAllBoxes = ()=>{
    charts.forEach(c=>{ if(c._boxEl) c._boxEl.setAttribute('display','none'); });
  };
  const updateLabel = (t, x, ovH)=>{
    const labelStr = t.toFixed(3)+'s';

    const tw = labelStr.length * 6.5 + 10;
    labelRect.setAttribute('x', x - tw/2);
    labelRect.setAttribute('y', ovH - 33);
    labelRect.setAttribute('width', tw);
    labelRect.setAttribute('height', 16);
    labelText.setAttribute('x', x);
    labelText.setAttribute('y', ovH - 21);
  };
  const hideCrosshair = ()=>{
    /* 未固定时鼠标离开曲线区域：竖线保留在鼠标最后位置，不隐藏 */
    resetHoverColors();   /* 离开：悬停颜色恢复默认 */
  };
  document.addEventListener('mousemove',(e)=>{
    lastClientX=e.clientX; lastClientY=e.clientY;   /* 记录鼠标位置供离开方向判断 */
    moveHist.push({x:e.clientX,y:e.clientY,t:Date.now()});
    if(moveHist.length>12) moveHist.shift();
    const tgt = e.target && e.target.closest ? (e.target.closest('.chart') || e.target.closest('.xaxis-chart')) : null;
    if(!tgt){ hideCrosshair(); return; }
    const rect = tgt.getBoundingClientRect();
    const plotW = rect.width - 86;   // 左78 + 右8
    const mx = e.clientX - rect.left;
    if(plotW<=0 || mx<78 || mx>rect.width-8){ hideCrosshair(); return; }
    const t = curXMin + (mx-78)/plotW*(curXMax-curXMin);
    if(!isFinite(t)){ hideCrosshair(); return; }
    const ovRect = ov.getBoundingClientRect();
    lastT = t;
    hoveredChart = tgt.classList.contains('xaxis-chart') ? null : charts.find(c=>c.getDom()===tgt);
    updateHoverColors(hoveredChart);   /* 悬停颜色跟随（固定状态下保持默认） */
    if(pinned != null) return;                 // 已固定：显示保持不变
    // 吸附最近数据点仅用于时间（Real值/标签），竖线与方框始终与鼠标同一竖线
    let snapT = t;
    const lineX = e.clientX - ovRect.left;
    if(hoveredChart){
      const series = hoveredChart._series;
      const idx = (series && series.length) ? nearestDataIdx(series, t) : -1;

    const reg = crosshairRegion(ovRect);        // 竖线仅贯穿曲线显示区域
    applyCrosshairClip(reg);
    updateLabel(snapT, lineX, reg.bottom);
    charts.forEach(c=>setLiveReal(c, snapT));
    hideAllBoxes();
    if(hoveredChart) drawBox(hoveredChart, snapT, ovRect);   // 仅悬停图表显示方框（定在数据圆点上）
    line.setAttribute('display','block');      // 竖线实时显示
    line.setAttribute('x1', lineX);
    line.setAttribute('x2', lineX);
    line.setAttribute('y1', reg.top);
    line.setAttribute('y2', reg.bottom);
    ov.classList.add('show');
  });
  document.addEventListener('click',(e)=>{
    const tgt = e.target && e.target.closest ? (e.target.closest('.chart') || e.target.closest('.xaxis-chart')) : null;
    if(!tgt || lastT==null) return;
    const ovRect = ov.getBoundingClientRect();
    if(pinned == null){
      pinned = lastT;                          // 固定：显示竖线+方框+Real+标签
      pinnedChart = hoveredChart;
      const reg = crosshairRegion(ovRect);
      applyCrosshairClip(reg);
      line.setAttribute('display','block');
      /* 竖线吸附到固定时间点的数据圆点位置（与方框同一X） */
      if(pinnedChart && pinnedChart._series && pinnedChart._series.length){
        const pidx=nearestDataIdx(pinnedChart._series, pinned);
        const pp=pinnedChart._series[pidx];
        if(pp && pp[1]!=null){
          const ppx=pinnedChart.convertToPixel({xAxisIndex:0}, pp[0]);
          if(ppx!=null && isFinite(ppx)){
            const pcr=pinnedChart.getDom().getBoundingClientRect();
            lastOverlayX = pcr.left - ovRect.left + ppx;
          }
        }
      }
      line.setAttribute('x1', lastOverlayX);
      line.setAttribute('x2', lastOverlayX);
      line.setAttribute('y1', reg.top);
      line.setAttribute('y2', reg.bottom);
      updateLabel(pinned, lastOverlayX, reg.bottom);
      charts.forEach(c=>setLiveReal(c, pinned));
      hideAllBoxes();
      if(pinnedChart) drawBox(pinnedChart, pinned, ovRect);
      resetHoverColors();   /* 固定后悬停颜色保持默认（白色） */
      ov.classList.add('show');
    } else {
      pinned = null;                           // 取消固定：竖线保留在当前位置
      pinnedChart = null;
    }
  });
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape' && pinned != null){
      pinned = null;                           // 取消固定：竖线保留在当前位置
      pinnedChart = null;
    }
  });
  document.addEventListener('mouseleave', hideCrosshair);
  /* 未固定时鼠标离开曲线区域：左/右边界离开（含斜向）按X吸附最近边缘；
     上/下边沿离开时按最近移动方向判定（水平主导则吸附边缘，竖直主导则保留最后位置） */
  $('chartArea').addEventListener('mouseleave', (e)=>{
    if(pinned != null) return;
    resetHoverColors();   /* 离开曲线区：悬停颜色恢复默认 */
    const r=$('chartArea').getBoundingClientRect();
    if(e.clientY > r.top && e.clientY < r.bottom){
      if(e.clientX <= r.left) snapCrosshairToEdge('left');
      else if(e.clientX >= r.right) snapCrosshairToEdge('right');
      return;
    }
    /* 上/下边沿离开：按最近移动方向判定（向左滑出但经过上/下边沿时也吸附最左） */
    const h=moveHist;
    if(h.length>=2){
      const a=h[0], b=h[h.length-1];
      const dx=Math.abs(b.x-a.x), dy=Math.abs(b.y-a.y);
      if(dx>dy){
        if(b.x<a.x) snapCrosshairToEdge('left');
        else if(b.x>a.x) snapCrosshairToEdge('right');
      }
    }
    /* 竖直主导（向上/下离开）：竖线保留在鼠标最后位置 */
  });
  /* 固定竖线后：页面/图表区滚动时方框跟随数据点移动 */
  $('chartArea').addEventListener('scroll', ()=>{ if(pinned != null) refreshPinnedDisplay(); });
  window.addEventListener('scroll', ()=>{ if(pinned != null) refreshPinnedDisplay(); });
  window.addEventListener('resize', ()=>{ if(pinned != null) refreshPinnedDisplay(); });
  /* 布局变化（面板开合/全屏/信号选择区等）时刷新固定显示，避免竖线与方框停留在旧位置 */
  let pinnedRefreshTimer = null;
  new ResizeObserver(()=>{
    if(pinned == null) return;
    clearTimeout(pinnedRefreshTimer);
    pinnedRefreshTimer = setTimeout(()=>{ if(pinned != null) refreshPinnedDisplay(); }, 80);
    setTimeout(()=>{ if(pinned != null) refreshPinnedDisplay(); }, 350);
  }).observe($('analysisWrap'));
}
/* 在指定时间/位置绘制十字线显示（竖线+时间标签+Real值+方框），供初始状态与默认位置使用 */
function drawCrosshairAt(t, lineX){
  const ov=$('crosshairOverlay');
  const line=$('chLine');
  if(!ov || !line) return;
  const ovRect=ov.getBoundingClientRect();
  lastT=t; lastOverlayX=lineX;
  const reg=crosshairRegion(ovRect);
  applyCrosshairClip(reg);
  line.setAttribute('display','block');
  line.setAttribute('x1',lineX);
  line.setAttribute('x2',lineX);
  line.setAttribute('y1',reg.top);
  line.setAttribute('y2',reg.bottom);
  const labelStr=t.toFixed(3)+'s';
  const lt=$('chLabelText'), lr=$('chLabelRect');
  if(lt && lr){
    lt.textContent=labelStr;
    const tw=labelStr.length*6.5+10;
    lr.setAttribute('x',lineX-tw/2);
    lr.setAttribute('y',reg.bottom-33);
    lr.setAttribute('width',tw);
    lr.setAttribute('height',16);
    lt.setAttribute('x',lineX);
    lt.setAttribute('y',reg.bottom-21);
  }
  charts.forEach(c=>setLiveReal(c,t));
  /* 方框精确落在数据圆点上（取首个有数据的图表） */
  charts.forEach(c=>{ if(c._boxEl) c._boxEl.setAttribute('display','none'); });
  const c0=charts.find(c=>c._series && c._series.length);
  if(c0) drawBoxAtPoint(c0, t, ovRect);
  ov.classList.add('show');
}
/* 在数据圆点位置绘制方框（边缘停留/初始状态时与竖线同在边缘） */
function drawBoxAtPoint(c, t, ovRect){
  const box=c._boxEl;
  if(!box) return;
  const series=c._series;
  if(!series || !series.length){ box.setAttribute('display','none'); return; }
  const idx=nearestDataIdx(series, t);
  const p=series[idx];
  if(!p || p[1]==null){ box.setAttribute('display','none'); return; }
  const px=c.convertToPixel({xAxisIndex:0}, p[0]);
  const py=c.convertToPixel({yAxisIndex:0}, p[1]);
  if(px==null || py==null || !isFinite(px) || !isFinite(py)){ box.setAttribute('display','none'); return; }
  const ch=c.getDom().clientHeight;
  if(py<0 || py>ch){ box.setAttribute('display','none'); return; }
  const cr=c.getDom().getBoundingClientRect();
  if(cr.bottom<ovRect.top || cr.top>ovRect.bottom){ box.setAttribute('display','none'); return; }
  box.setAttribute('width','10');   /* 保持方框原有大小 */
  box.setAttribute('height','10');
  box.setAttribute('display','block');
  box.setAttribute('x', cr.left-ovRect.left+px-5);
  box.setAttribute('y', cr.top-ovRect.top+py-5);
}
/* 悬停颜色跟随：CANalyzer风格Real数值颜色跟随曲线；默认风格信号名称变亮蓝；固定/离开恢复 */
function updateHoverColors(hoveredChart){
  if(pinned != null){ resetHoverColors(); return; }   /* 竖线固定期间保持默认颜色 */
  if(uiStyle==='canalyzer'){
    charts.forEach(c=>{
      const lv=c._liveEl; if(!lv) return;
      const ve=lv.querySelector('.lvval'); if(!ve) return;
      ve.style.color = (c===hoveredChart) ? c._color : '#fff';
    });
  } else {
    charts.forEach(c=>{
      const side=c._sideEl; if(!side) return;
      const nm=side.querySelector('.signame'); if(!nm) return;
      nm.style.color = (c===hoveredChart) ? '#4a9eff' : '#fff';   /* 默认风格：悬停曲线时名称亮蓝，离开恢复白色 */
    });
  }
}
function resetHoverColors(){
  if(uiStyle==='canalyzer'){
    charts.forEach(c=>{
      const lv=c._liveEl; if(!lv) return;
      const ve=lv.querySelector('.lvval'); if(!ve) return;
      ve.style.color='#fff';
    });
  } else {
    charts.forEach(c=>{
      const side=c._sideEl; if(!side) return;
      const nm=side.querySelector('.signame'); if(!nm) return;
      nm.style.color='#fff';
    });
  }
}
/* 生成曲线后：竖虚线默认显示在所有曲线最右侧 */
function initCrosshairRight(){
  if(!charts.length || !ascData) return;
  const ov=$('crosshairOverlay');
  if(!ov) return;
  const ovRect=ov.getBoundingClientRect();
  let lineX=ovRect.width-8;
  const c0=charts.find(c=>c._series && c._series.length);
  if(c0){
    const px=c0.convertToPixel({xAxisIndex:0}, ascData.tMax);
    if(px!=null && isFinite(px)){
      const cr=c0.getDom().getBoundingClientRect();
      lineX=cr.left-ovRect.left+px;
    }
  }
  drawCrosshairAt(ascData.tMax, lineX);
}
/* 鼠标向左/右离开曲线区域时，竖线停到曲线最左/最右侧 */
function snapCrosshairToEdge(side){
  if(!charts.length || !ascData) return;
  const ov=$('crosshairOverlay');
  if(!ov) return;
  const t = side==='left' ? curXMin : curXMax;
  const ovRect=ov.getBoundingClientRect();
  let lineX = side==='left' ? 78 : ovRect.width-8;
  const c0=charts.find(c=>c._series && c._series.length);
  if(c0){
    const px=c0.convertToPixel({xAxisIndex:0}, t);
    if(px!=null && isFinite(px)){
      const cr=c0.getDom().getBoundingClientRect();
      lineX=cr.left-ovRect.left+px;
    }
  }
  drawCrosshairAt(t, lineX);
}
/* 渲染完成后为每个信号图表创建/重建方框元素 */
function setupCrosshairBoxes(){
  const group = $('chBoxGroup');
  if(!group) return;
  while(group.firstChild) group.firstChild.remove();
  charts.forEach(c=>{
    const box = document.createElementNS(SVG_NS,'rect');
    box.setAttribute('width','10');
    box.setAttribute('height','10');
    box.setAttribute('rx','1');
    box.setAttribute('fill','rgba(255,255,255,0.12)');
    box.setAttribute('stroke','#ffffff');
    box.setAttribute('stroke-width','1');
    box.setAttribute('display','none');
    group.appendChild(box);
    c._boxEl = box;
  });
}
/* 横轴缩放后：以固定竖线为中心缩放并保持竖线与方框贴合 */
function refreshPinnedDisplay(){
  if(pinned == null || !pinnedChart) return;
  const ov = $('crosshairOverlay');
  const line = $('chLine');
  if(!ov || !line) return;
  const ovRect = ov.getBoundingClientRect();
  const series = pinnedChart._series;
  const idx = series && series.length ? nearestDataIdx(series, pinned) : -1;
  const p = series && series[idx];
  let lineX = lastOverlayX;
  if(p && p[1]!=null){
    const px = pinnedChart.convertToPixel({xAxisIndex:0}, p[0]);
    if(px!=null && isFinite(px)){
      const cr = pinnedChart.getDom().getBoundingClientRect();
      lineX = cr.left - ovRect.left + px;   /* 竖线跟随固定数据点（缩放/滚动后无偏移） */
    }
  }
  lastOverlayX = lineX;
  const reg = crosshairRegion(ovRect);
  applyCrosshairClip(reg);
  line.setAttribute('x1', lineX);
  line.setAttribute('x2', lineX);
  line.setAttribute('y1', reg.top);
  line.setAttribute('y2', reg.bottom);
  const labelStr = pinned.toFixed(3)+'s';
  const lt = $('chLabelText');
  const lr = $('chLabelRect');
  if(lt && lr){
    lt.textContent = labelStr;
    const tw = labelStr.length * 6.5 + 10;
    lr.setAttribute('x', lineX - tw/2);
    lr.setAttribute('y', reg.bottom - 33);
    lr.setAttribute('width', tw);
    lr.setAttribute('height', 16);
    lt.setAttribute('x', lineX);
    lt.setAttribute('y', reg.bottom - 21);
  }
  const box = pinnedChart._boxEl;
  if(box && p && p[1]!=null){
    const px = pinnedChart.convertToPixel({xAxisIndex:0}, p[0]);
    const py = pinnedChart.convertToPixel({yAxisIndex:0}, p[1]);
    if(px!=null && py!=null && isFinite(px) && isFinite(py)){
      const ch = pinnedChart.getDom().clientHeight;
      if(py < 0 || py > ch){ box.setAttribute('display','none'); return; }
      const cr = pinnedChart.getDom().getBoundingClientRect();
      box.setAttribute('width','10');   /* 保持方框原有大小 */
      box.setAttribute('height','10');
      box.setAttribute('display','block');
      box.setAttribute('x', cr.left - ovRect.left + px - 5);   /* 方框定在数据圆点上 */
      box.setAttribute('y', cr.top - ovRect.top + py - 5);
    }
  }
  charts.forEach(c=>setLiveReal(c, pinned));
}

/* Replace out-of-bounds y-values with null so the line breaks into separate segments.
   This ensures the out-of-range portion is truly empty (no line along the boundary)
   while keeping every visible point at its exact coordinate. */
function clipSeriesY(chart, lo, hi){
  const orig = chart._series;
  if(!orig || orig.length === 0) return;
  if(lo == null || hi == null){
    chart.setOption({series:[{data:orig}]});
    return;
  }
  const n = orig.length;
  const newData = new Array(n);
  for(let i = 0; i < n; i++){
    const p = orig[i];
    const v = p[1];
    if(v != null && (v < lo || v > hi)){
      newData[i] = [p[0], null];
    } else {
      newData[i] = p;
    }
  }
  chart.setOption({series:[{data:newData}]});
}

/* y auto-fit: 使用信号的全局最大最小值，并模拟鼠标在Y轴中心处进行一格滚轮缩放（放大范围，留出空间） */
function fitY(chart){
  const stats=chart._stats;
  if(!stats || stats.count===0) return;
  let ymin=stats.min, ymax=stats.max;
  if(ymin===ymax){ ymin-=1; ymax+=1; }
  /* 模拟鼠标在Y轴中心处进行一格滚轮缩放（zoom out, factor=1.2） */
  const center=(ymin+ymax)/2;
  const halfRange=(ymax-ymin)/2;
  ymin=center-halfRange*1.2;
  ymax=center+halfRange*1.2;
  chart.setOption({yAxis:{min:ymin,max:ymax}});
  clipSeriesY(chart, ymin, ymax);
}
function fitAllY(){ charts.forEach(c=>fitY(c)); if(pinned != null) refreshPinnedDisplay(); }

/* sync x-axis across charts + custom wheel zoom on axes */
function syncXAxis(nLo, nHi){
  curXMin = nLo; curXMax = nHi;
  charts.forEach(c=>c.setOption({xAxis:{min:nLo,max:nHi}}));
  if(xAxisChart) xAxisChart.setOption({xAxis:{min:nLo,max:nHi}});
  updateXInputs(nLo, nHi);
  if(pinned != null) refreshPinnedDisplay();   // 固定状态：竖线贴合方框
}
function updateXInputs(lo, hi){
  const minEl=$('gXmin'), maxEl=$('gXmax');
  if(!minEl||!maxEl) return;
  if(lo!=null) minEl.value=lo.toFixed(3);
  if(hi!=null) maxEl.value=hi.toFixed(3);
}
function setupSync(){
  /* capture-phase wheel on chartArea: if not on Y axis → scroll, else let chart handle Y zoom */
  const chartAreaEl=$('chartArea');
  chartAreaEl.addEventListener('wheel',(e)=>{
    /* check if mouse is on Y axis of the chart that received the event */
    let onYAxis=false;
    for(const c of charts){
      const dom=c.getDom();
      if(!dom.contains(e.target)) continue;
      const rect=dom.getBoundingClientRect();
      const mx=e.clientX-rect.left, my=e.clientY-rect.top;
      const h=rect.height;
      const opt=c.getOption();
      const grid=opt.grid||{left:78,top:0,bottom:0};
      const gL=typeof grid.left==='number'?grid.left:78;
      const gT=typeof grid.top==='number'?grid.top:0;
      const gB=typeof grid.bottom==='number'?grid.bottom:0;
      if(mx<=gL && my>=gT && my<=(h-gB)){ onYAxis=true; break; }
    }
    if(onYAxis) return; /* let chart's Y zoom handler work */
    e.preventDefault();
    e.stopImmediatePropagation();
    chartAreaEl.scrollTop += e.deltaY;
  },{passive:false,capture:true});

  charts.forEach(src=>{
    /* custom wheel: Y axis area → Y zoom (per chart, anchored at mouse) */
    const dom=src.getDom();
    dom.addEventListener('wheel',(e)=>{
      const rect=dom.getBoundingClientRect();
      const mx=e.clientX-rect.left, my=e.clientY-rect.top;
      const w=rect.width, h=rect.height;
      const opt=src.getOption();
      const grid=opt.grid||{left:78,right:8,top:0,bottom:0};
      const gL=typeof grid.left==='number'?grid.left:78;
      const gR=typeof grid.right==='number'?grid.right:8;
      const gT=typeof grid.top==='number'?grid.top:0;
      const gB=typeof grid.bottom==='number'?grid.bottom:0;
      const onYAxis = mx <= gL && my >= gT && my <= (h-gB);
      if(!onYAxis) return; /* let page scroll */
      e.preventDefault();
      const factor = e.deltaY > 0 ? 1.2 : 0.83;
      const yAx=opt.yAxis[0];
      let lo=yAx.min, hi=yAx.max;
      if(lo==null||hi==null){
        const st=src._stats;
        if(st&&st.count>0){ lo=st.min; hi=st.max; } else { lo=-1; hi=1; }
      }
      if(lo===hi){ lo-=1; hi+=1; }
      /* convert mouse Y pixel to data value (Y axis is bottom-to-top) */
      const plotH=h-gT-gB;
      const py=Math.max(0,Math.min(plotH, my-gT));
      const anchor=hi-(hi-lo)*(py/plotH);
      const nLo=anchor-(anchor-lo)*factor;
      const nHi=anchor+(hi-anchor)*factor;
      src.setOption({yAxis:{min:nLo,max:nHi}});
      clipSeriesY(src, nLo, nHi);
      if(pinned != null) refreshPinnedDisplay();   /* 纵轴缩放后固定方框跟随曲线 */
    },{passive:false});
  });
  /* x-axis chart: scroll anywhere → X zoom (synced, anchored at mouse) */
  if(xAxisChart){
    const dom=xAxisChart.getDom();
    dom.addEventListener('wheel',(e)=>{
      e.preventDefault();
      const rect=dom.getBoundingClientRect();
      const mx=e.clientX-rect.left;
      const w=rect.width;
      const opt=xAxisChart.getOption();
      const grid=opt.grid||{left:78,right:8};
      const gL=typeof grid.left==='number'?grid.left:78;
      const gR=typeof grid.right==='number'?grid.right:8;
      const xAx=opt.xAxis[0];
      let lo=xAx.min, hi=xAx.max;
      if(lo==null||hi==null){ lo=ascData.tMin; hi=ascData.tMax; }
      const plotW=w-gL-gR;
      /* 竖线已固定：以固定竖线为中心缩放；未固定：以鼠标位置为中心 */
      let anchor;
      if(pinned != null){
        anchor = pinned;
      } else {
        const px=Math.max(0,Math.min(plotW, mx-gL));
        anchor=lo+(hi-lo)*(px/plotW);
      }
      const factor = e.deltaY > 0 ? 1.2 : 0.83;
      const nLo=anchor-(anchor-lo)*factor;
      const nHi=anchor+(hi-anchor)*factor;
      syncXAxis(nLo, nHi);
    },{passive:false});
  }
}
function resetZoom(){
  const tMin=ascData.tMin, tMax=ascData.tMax;
  syncXAxis(tMin, tMax);
}

/* ---------- analysis panel ---------- */
function renderAnalysis(sigs){
  const panel=$('analysisPanel');
  const issues=[];
  // summary
  const dur=ascData.tMax-ascData.tMin;
  const rate=dur>0?(ascData.totalMessages/dur):0;
  const dbcIds=new Set(Object.keys(dbcData.messages));
  const unknownIds=ascData.idOrder.filter(k=>!dbcIds.has(k));
  let sumHtml=`<div class="a-summary">
    <span class="chip">报文总数 <b>${ascData.totalMessages.toLocaleString()}</b></span>
    <span class="chip">时间范围 <b>${ascData.tMin.toFixed(3)}–${ascData.tMax.toFixed(3)} s</b> (时长 ${dur.toFixed(3)} s)</span>
    <span class="chip">平均报文率 <b>${rate.toFixed(1)}</b> msg/s</span>
    <span class="chip">不同ID数 <b>${ascData.idOrder.length}</b></span>
    <span class="chip ${unknownIds.length?'warn':''}">未知ID(DBC未定义) <b>${unknownIds.length}</b></span>
    <span class="chip">已选信号 <b>${sigs.length}</b></span>
  </div>`;
  // unknown id issues
  unknownIds.forEach(k=>{
    const e=ascData.map[k];
    issues.push({sev:'warn', tag:fmtId(e.realId,e.isExt), text:`未知报文出现 <b>${e.count}</b> 次（DBC 中未定义，无法解析信号）`});
  });
  // per-signal analysis
  for(const sig of sigs){
    const md=ascData.map[sig.messageKey];
    const found = charts.find(c=>c._sig===sig);
    const series = (found && found._series) ? found._series : buildSeries(sig);
    const st=computeStats(series,sig);
    if(!md || st.count===0){
      issues.push({sev:'err', tag:sig.name, text:`信号无数据：报文 ${sig.messageName} 在 ASC 中未出现`});
      continue;
    }
    // out of range
    if(st.outRange>0 && sig.min!==-Infinity && sig.max!==Infinity){
      const pct=(st.outRange/st.count*100);
      issues.push({sev: pct>5?'err':'warn', tag:sig.name, text:`${st.outRange} 个采样(${pct.toFixed(1)}%) 超出物理范围 [${sig.min}, ${sig.max}] ${sig.unit}`});
    }
    // constant / stuck
    if(st.count>20 && st.allSame){
      issues.push({sev:'err', tag:sig.name, text:`信号长时间恒定 = ${st.min} ${sig.unit}（可能传感器故障或信号未更新）`});
    } else if(st.count>20 && st.std< (st.max-st.min)*0.0005 && st.max!==st.min){
      issues.push({sev:'warn', tag:sig.name, text:`信号变化极小 (σ=${st.std.toFixed(4)})，近恒定状态`});
    }
    // gaps / dropouts
    const g=analyzeGaps(md);
    if(g && g.med>0 && g.maxGap>g.med*3 && g.maxGap>g.med+0.005){

async function loadDbcText(name, txt, showBusy){
  const token = showBusy ? startBusy('解析 DBC 文件…', ()=>{ token.cancelled=true; }, {immediate:true}) : null;
  try{
    dbcData = await parseDBC(txt, showBusy ? ()=>token.cancelled : null);
    if(showBusy && (token.cancelled || !dbcData || dbcData.cancelled)){
      dbcData=null; $('dbcInfo').textContent='未加载'; $('dbcInfo').classList.remove('loaded');
      toast('已取消 DBC 解析'); return;
    }
    $('dbcInfo').textContent = name;   /* 显示文件路径+文件名 */

  finally{ stopLoadTxt(); if(showBusy) finishBusy(); }
}

/* 按已选信号顺序重排曲线图表（DOM 卡片 + charts 数组，不重新解析数据） */
function reorderChartsBySelection(){
  const ca=$('chartArea');
  if(!ca || !charts.length) return;
  const sigs=selectedSignals();
  const byKey=new Map();
  charts.forEach(c=>{ byKey.set(c._sig.messageKey+'::'+c._sig.name, c); });
  const newCharts=[];
  sigs.forEach(s=>{
    const k=s.messageKey+'::'+s.name;
    const c=byKey.get(k);
    if(c && !newCharts.includes(c)){
      newCharts.push(c);
      const card=c.getDom().closest('.chart-card');
      if(card) ca.appendChild(card);
    }
  });
  /* 未匹配到的保持在末尾原顺序 */
  charts.forEach(c=>{ if(!newCharts.includes(c)) newCharts.push(c); });
  charts=newCharts;
  /* 侧栏名称行与曲线同步重排（仅 CANalyzer 风格有独立名称行） */
  if(uiStyle!=='classic'){
    const sc=$('scBody');
    if(sc) charts.forEach(c=>{ const row=c._rowEl; if(row) sc.appendChild(row); });
  }
  /* 按新顺序重新分配曲线颜色（默认风格全亮蓝；CANalyzer风格循环取色），信号名统一白色 */
  charts.forEach((c,i)=>{
    const color = uiStyle==='classic' ? '#4a9eff' : CURVE_COLORS[i % CURVE_COLORS.length];
    c._color=color;
    if(c._series){
      try{ c.setOption({series:[{lineStyle:{color:color}, itemStyle:{color:color, borderColor:color}}]}); }catch(e){}
    }
    const row=c._rowEl || c._sideEl;
    if(row){
      row._color=color;
      const sw=row.querySelector('.swatch'); if(sw) sw.style.background=color;
      const nmEl=row.querySelector('.signame'); if(nmEl) nmEl.style.color='var(--txt2)';
    }
  });
  /* 竖线固定时方框跟随最新布局 */
  if(pinned != null) refreshPinnedDisplay();
}

    try{ c.setOption({series:[{showSymbol:on,symbolSize:on?4:0}]}); }catch(e){}
    if(busyState) $('busyTimer').textContent = Math.floor((Date.now()-busyState.startTime)/1000)+' s';
    setTimeout(step,0);
  }
  step();
}
$('gDots').onclick=()=>{
  if(gDotsBusy) return;   /* 当前动作执行中不接收新点击 */
  const btn=$('gDots');
  flashEl(btn);
  const turningOn = !btn.classList.contains('active');
  /* 数据量较大时先弹确认框 */
  const big = selectedSet.size >= 10 || (ascFileSize != null && ascFileSize >= 10*1024*1024);
  if(turningOn && big){
    showConfirmBox('数据量较大，显示圆点会比较卡哦~', ()=>{
      btn.classList.add('active');
      applyDots(true);
    }, ()=>{
      btn.classList.remove('active');
    });
    return;
  }
  btn.classList.toggle('active');
  applyDots(turningOn);
};
/* 全局控制：X轴自适应（重置缩放） */
$('gFitX').onclick=resetZoom;
/* 全局控制：Y轴自适应 */
$('gFitY').onclick=fitAllY;
/* 全局控制：X min/max 输入 */
function applyXRange(){
  const lo=parseFloat($('gXmin').value);
  const hi=parseFloat($('gXmax').value);
  if(isNaN(lo)||isNaN(hi)||lo>=hi) return;
  syncXAxis(lo, hi);
}
$('gXmin').addEventListener('change', applyXRange);
$('gXmax').addEventListener('change', applyXRange);
window.addEventListener('resize',()=>{ charts.forEach(c=>c.resize()); if(xAxisChart)xAxisChart.resize(); });

/* 发布时间显示：按设备/浏览器所在时区显示对应时间（如 2026-08-14 13:56:46发布） */
(function(){
  // 修改时间（UTC），每次更新页面时由开发者同步修改
  const MOD_UTC = Date.UTC(2026, 7, 17, 5, 33, 27);
  const d = new Date(MOD_UTC);
  const pad = n => String(n).padStart(2,'0');
  const dateStr = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  const timeStr = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  $('hmodtime').textContent = dateStr + ' ' + timeStr + '发布';
})();
/* GitHub 提交号显示：页面加载时获取该仓库最新提交号，显示在标题与发布时间之间 */
(function(){
  const el=$('hcommit');
  if(!el) return;
  fetch('https://api.github.com/repos/Wang106/CANAnalysis/commits?path=public/index.html&per_page=1')
    .then(r=>r.json())
    .then(j=>{
      if(j && j.length && j[0] && j[0].sha){
        el.textContent = j[0].sha.slice(0,8);   /* 只显示完整提交号前8位 */
        el.title = 'GitHub 提交号 ' + j[0].sha;
      }
    })
    .catch(()=>{});
})();

// init
renderSignalList();
renderPickedList();
</script>

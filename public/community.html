<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="CANAnalysis 用户评论、站务留言与账号中心"><title>评论与留言 · CANAnalysis</title><link rel="icon" href="/icon.png"><link rel="stylesheet" href="/community.css"><script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script><script src="/community.js" defer></script></head><body>
<header class="shell"><a class="brand" href="/"><img src="/icon.png" alt=""><span>CANAnalysis</span></a></header>
<main class="shell"><section class="hero"><small>COMMUNITY</small><h1>评论与站务留言</h1><p>评论仅对已登录并验证邮箱的用户开放。请友善交流，不要上传个人敏感信息、企业机密或危险文件。</p></section>
<div class="layout"><aside><section class="card" id="authCard"><div class="tabs"><button type="button" data-tab="login" class="active">登录</button><button type="button" data-tab="register">注册</button></div>
<form id="loginForm" class="stack"><label>邮箱<input name="email" type="email" autocomplete="email" required></label><label>密码<input name="password" type="password" autocomplete="current-password" minlength="12" required></label><div id="loginTurnstile"></div><button class="primary">登录</button></form>
<form id="registerForm" class="stack hidden"><label>邮箱<input name="email" type="email" autocomplete="email" required></label><label>昵称<input name="displayName" minlength="2" maxlength="32" required></label><label>密码<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><label class="checkbox"><input name="crossBorderConsent" type="checkbox" required><span>我已阅读<a href="/privacy" target="_blank">隐私政策</a>，并单独同意将账号、评论与附件交由 Cloudflare 在境外处理。</span></label><div id="registerTurnstile"></div><button class="primary">注册并验证邮箱</button></form>
<details><summary>没有收到验证邮件</summary><form id="resendForm" class="stack compact"><label>注册邮箱<input name="email" type="email" autocomplete="email" required></label><div id="resendTurnstile"></div><button>重新发送验证邮件</button></form></details>
<details><summary>忘记密码</summary><form id="forgotForm" class="stack compact"><label>账号邮箱<input name="email" type="email" autocomplete="email" required></label><div id="forgotTurnstile"></div><button>发送重置邮件</button></form></details>
<form id="resetForm" class="stack hidden"><h3>设置新密码</h3><input name="token" type="hidden"><label>新密码<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><button class="primary">保存新密码</button></form><p id="authStatus" class="status" role="status"></p></section>
<section class="card hidden" id="accountCard"><div class="account"><span>当前账号</span><strong id="accountName"></strong><form id="profileForm" class="stack"><label>昵称<input name="displayName" minlength="2" maxlength="32" required></label><label>个性签名<textarea name="bio" maxlength="280"></textarea></label><label>头像（JPG、PNG 或 WebP，不超过2MB）<input name="avatar" type="file" accept="image/jpeg,image/png,image/webp"></label><button>保存个人资料</button></form><form id="passwordForm" class="stack compact"><label>当前密码<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>新密码<input name="newPassword" type="password" autocomplete="new-password" minlength="12" required></label><button>修改密码</button></form><button type="button" id="exportButton">下载我的数据</button><button type="button" id="logoutButton">退出登录</button><button type="button" id="deleteAccountButton" class="danger">注销账号并删除个人资料</button><p id="accountStatus" class="status" role="status"></p></div></section>
<nav class="policy-links"><a href="/privacy">隐私政策</a><a href="/terms">用户协议</a><a href="/community-guidelines">社区规则</a><a href="/aboutus">关于本站</a></nav></aside>
<section class="stack"><section class="card"><h2>发布评论</h2><form id="commentForm" class="stack"><label>内容<textarea name="body" maxlength="2000" placeholder="分享建议、使用体验或需要协助的问题" required></textarea></label><label>附件（最多3个，每个不超过10MB）<input name="files" type="file" multiple accept="image/jpeg,image/png,image/webp,application/pdf,text/plain,text/csv"></label><div id="fileStatus" class="file-list"></div><button class="primary">发布</button></form><p id="commentStatus" class="status" role="status"></p></section><section><h2>最新评论</h2><div id="comments" class="comments" aria-live="polite"></div><button type="button" id="moreButton" class="hidden">加载更多</button></section></section></div></main></body></html>
